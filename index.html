告試題｜114年第四梯次","question":"【114年第四梯次・人工智慧基礎概論・第20題】某醫院希望開發一個系統，根據患者的年齡、血壓與BMI 等資訊，預測 其罹患糖尿病的機率（0~1），並依據預測值是否超過0.5 做出風險警 示。下列哪一種模型最適合用於此分類任務？","options":["邏輯迴歸（Logistic Regression）","支援向量機（Support Vector Machine）","決策樹（Decision Tree）","K 平均演算法（K-means）"],"answer":0,"explanation":"官方公告標準答案：A。來源：114年第四梯次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"114年第四梯次","number":20},{"id":20020,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・人工智慧基礎概論・第21題】某金融科技公司正開發一套違約風險預測系統，需大量處理不同客戶 的財務特徵資料。考量到資料特徵數量眾多，且希望提升預測的穩定性 與泛化能力，下列哪一種鑑別式AI 模型最適合？","options":["邏輯迴歸（Logistic Regression）","支援向量機（Support Vector Machine）","決策樹（Decision Tree）","隨機森林（Random Forest）"],"answer":3,"explanation":"官方公告標準答案：D。來源：114年第四梯次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"114年第四梯次","number":21},{"id":20021,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・人工智慧基礎概論・第22題】關於變分自編碼器（Variational Autoencoder, VAE）的運作流程，下 列何者敘述最為正確？","options":["解碼器的任務是將低維壓縮向量分類為不同類別","編碼器將輸入資料轉換為可視化圖像以利模型學習","編碼器將資料轉換為潛在空間表示，解碼器再重建資料","編碼器利用最大邊際機率對資料進行異常點偵測"],"answer":2,"explanation":"官方公告標準答案：C。來源：114年第四梯次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"114年第四梯次","number":22},{"id":20022,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・人工智慧基礎概論・第23題】下列何者不是我國數位發展部AI 產品與系統評測中心對生成式AI 的 評測項目?","options":["當責性","可靠性","隱私及資安","互動性"],"answer":3,"explanation":"官方公告標準答案：D。來源：114年第四梯次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"114年第四梯次","number":23},{"id":20023,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・人工智慧基礎概論・第24題】在保持GPT-OSS 模型架構不變的前提下，如果將模型參數量從20 億提 升至120 億，並假設有足夠的訓練資料支撐，下列敘述何者最正確？","options":["模型參數增加會線性提升效能，且即使訓練資料不變也不會遇到瓶 頸","參數越多模型推理越快，因為每層可以並行計算更多參數","較大的參數量能提升模型的表達能力與預測效能，但需足夠訓練資 料支持","增加參數量不影響記憶體使用，只會影響計算速度"],"answer":2,"explanation":"官方公告標準答案：C。來源：114年第四梯次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"114年第四梯次","number":24},{"id":20024,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・人工智慧基礎概論・第25題】在自然語言處理任務中，為了減少訓練語料中偏見對模型的影響，下列 哪種資料處理策略屬於常見的「資料去偏（Data Debiasing）」做法？","options":["讓模型在訓練時隨機替換輸出，以抵消資料中存在的系統性偏差","增加模型的參數量，依賴更大的模型自動消除原始資料中的偏見","調整或擴充訓練語料，使不同群體或類型資料的比例更加平衡，避 免模型過度偏向出現頻率高的類別","對訓練資料施加額外正則化或噪音，使模型在學習過程中對偏見敏 感度降低"],"answer":2,"explanation":"官方公告標準答案：C。來源：114年第四梯次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"114年第四梯次","number":25},{"id":20025,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・人工智慧基礎概論・第26題】在深度學習模型的微調（Fine-tuning）過程中，可能出現所謂的「災 難性遺忘（Catastrophic Forgetting）」。此現象最可能造成哪種情況？","options":["由於計算資源或訓練步驟不足，模型在微調過程中無法完整收斂， 導致學習效果受限","微調後模型的表現變得隨機，無法有效記憶新學到的模式與知識","微調後模型的部分權重產生偏移，導致模型無法針對較長的文字進 行回應","模型過度適應微調的資料分佈，逐漸遺忘先前預訓練所獲得的廣泛 知識，在原有任務或廣泛領域上表現變差"],"answer":3,"explanation":"官方公告標準答案：D。來源：114年第四梯次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"114年第四梯次","number":26},{"id":20026,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・人工智慧基礎概論・第27題】在大型Transformer 模型的效能優化過程中，常見的方法之一是「剪 枝（Pruning）」。下列哪一項最符合該方法的核心概念？","options":["將模型中所有權重按比例縮小，使其值更接近零，以降低計算量","移除模型中影響較小或冗餘的部分權重參數，以減少模型大小並提 升推理效率","在訓練時僅更新部分權重而將其他權重凍結，從而減少需要調整的 參數數量","根據注意力分數動態跳過處理部分輸入Token，以減少每次前向傳 播的計算"],"answer":1,"explanation":"官方公告標準答案：B。來源：114年第四梯次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"114年第四梯次","number":27},{"id":20027,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・人工智慧基礎概論・第28題】對非常長的輸入序列進行推理（Inference），Transformer 模型推理的 主要計算瓶頸通常是什麼？","options":["模型輸出層產生文本的過程，因為每生成一個詞都必須重新訓練整 個模型一次","詞嵌入 (Embedding) 查找操作，因為其時間複雜度隨詞彙表大小 指數級增長","Softmax 函數的計算，因為對每個Token 都需要執行繁重的運算","自注意力層的計算和其記憶體使用，因為注意力矩陣的大小隨序列 長度呈平方級增長"],"answer":3,"explanation":"官方公告標準答案：D。來源：114年第四梯次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"114年第四梯次","number":28},{"id":20028,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・人工智慧基礎概論・第29題】在「可解釋人工智慧（Explainable AI, XAI）」領域中，LIME（Local Interpretable Model-agnostic Explanations）方法最核心的應用目 的是什麼？","options":["解釋單一樣本（局部預測）的黑箱模型決策過程","全面提升黑箱模型整體的預測準確度","將黑箱模型轉換成完全可解釋的模型作為替代","用於生成大量擬真數據來替代訓練集"],"answer":0,"explanation":"官方公告標準答案：A。來源：114年第四梯次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"114年第四梯次","number":29},{"id":20029,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・人工智慧基礎概論・第30題】在醫療診斷決策支援系統等高風險領域中，「可解釋人工智慧 （Explainable AI, XAI）」的核心價值最主要呈現在哪個面向？","options":["透過提供可理解的決策依據，促進患者與醫療專業人員對系統診斷 結果的信任與接受度","以可解釋性方法優化臨床資料蒐集與管理流程，從而降低整體醫療 作業成本","利用解釋機制增強模型預測的統計顯著性與準確度，使其在研究及 實務應用中更具科學性","透過提供透明化的運作過程，進而減輕臨床人員負擔，並提升醫療 服務的整體效率"],"answer":0,"explanation":"官方公告標準答案：A。來源：114年第四梯次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"114年第四梯次","number":30},{"id":20030,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・人工智慧基礎概論・第31題】在金融科技公司的信貸決策系統中，導入反事實解釋（Counterfactual Explanation）時，實際部署往往伴隨技術與監管挑戰。下列哪一項最 符合該情境下的核心挑戰？","options":["需要建立完整的客戶行為預測模型來估算建議改變的實施成本，並 整合到現有的風險管理系統架構中","必須使用聯邦學習技術保護客戶隱私，同時在分散式環境中計算跨 機構的反事實解釋結果","需要建構時間序列因果圖來處理客戶信用狀況的動態變化，並預測 未來可能的信用評分軌跡","生成的反事實樣本必須滿足特徵間的因果約束和業務邏輯約束，同 時確保建議的改變在現實中具有可操作性且符合公平放貸法規"],"answer":3,"explanation":"官方公告標準答案：D。來源：114年第四梯次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"114年第四梯次","number":31},{"id":20031,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・人工智慧基礎概論・第32題】在統計推論中，若樣本來自母體但呈現明顯偏態分布，且樣本數有限， 下列哪一項策略最能減少推估母體參數的偏誤？","options":["直接使用樣本平均數與變異數估計母體參數，不做任何調整","增加樣本數並考慮使用分位數或中位數作為中心趨勢估計","將樣本隨機重新排列後，多次計算平均值以消除偏態影響","完全依賴樣本標準差來估計母體參數，忽略分布形態"],"answer":1,"explanation":"官方公告標準答案：B。來源：114年第四梯次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"114年第四梯次","number":32},{"id":20032,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・人工智慧基礎概論・第33題】在工業物聯網架構中，進行設備預測性維護（Predictive Maintenance） 時，若面對異常事件發生頻率極低、樣本高度不平衡的時間序列資料， 下列哪一種方法最能兼顧模型穩定性與異常偵測效能？","options":["將每筆異常事件資料複製多次以提升模型對異常的辨識敏感度，搭 配全序列訓練模型（如LSTM）","對時間序列進行差分與標準化後，使用傳統監督式學習模型（如 SVM）進行分類訓練","使用經過時間序列特化的SMOTE 技術生成異常樣本，以平衡異常與 正常資料比例","採用基於重建誤差的自編碼器模型（Sequence-to-Sequence Autoencoder）進行異常偵測，並僅使用正常資料進行訓練"],"answer":3,"explanation":"官方公告標準答案：D。來源：114年第四梯次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"114年第四梯次","number":33},{"id":20033,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・人工智慧基礎概論・第34題】在零售業進行客戶行為分析時，資料倉儲中發現多個欄位儲存相同的 購買金額資訊（例如：amount_usd、total_price、transaction_value）， 但其單位、命名慣例及格式不一致，進而導致特徵工程階段混淆模型輸 入。針對此種跨欄位語義重疊與結構冗餘問題，下列哪一種資料處理策 略最合適且具實務可行性？","options":["利用資料探勘技術自動選擇資料集中對目標變數最敏感的欄位，其 他欄位捨棄即可，避免過度清理干擾原始結構","保留所有相似欄位，交由高階模型（如Gradient Boosting 或 Deep Learning）自動學習特徵關聯，無需手動處理","建立欄位命名標準，統一金額單位與格式，進行欄位正規化與語義 合併，減少重複資訊影響特徵重要性估計","將重複欄位視為類別欄位，進行One-hot 編碼（One-hot encoding） 後輸入模型，以避免數值誤導模型學習過程"],"answer":2,"explanation":"官方公告標準答案：C。來源：114年第四梯次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"114年第四梯次","number":34},{"id":20034,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・人工智慧基礎概論・第35題】某大型零售企業準備將商品推薦模型上線，專案團隊在檢視訓練資料 時，發現部分商品類別（例如高價商品）樣本數量極少，而多數樣本集 中於低價商品。若此不平衡問題未妥善處理，下列何種狀況最可能在實 際推薦結果中發生？","options":["模型在預測時傾向輸出稀有類別，導致雖能捕捉到少數樣本，但精 確率（Precision）顯著下降","模型由於類別分布不均，難以建立有效的線性分離邊界，進而無法 收斂","模型過度聚焦於稀有類別樣本，導致對多數類別的預測能力下降， 整體效能受損","模型學到的決策邊界主要由多數類別主導，忽視了稀有類別，造成 該類別的召回率（Recall）大幅降低"],"answer":3,"explanation":"官方公告標準答案：D。來源：114年第四梯次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"114年第四梯次","number":35},{"id":20035,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・人工智慧基礎概論・第36題】某電商資料團隊要協助行銷部門規劃再行銷策略。目前取得資料包含 使用者點擊、購買紀錄、流量來源與轉換率。若資料團隊希望先進行探 索性資料分析（EDA），下列哪一項最符合EDA 的做法？","options":["建立隨機森林模型，預測使用者是否會完成購買","使用K-means 對使用者群進行分群並立即制定對應促銷策略","繪製各類流量來源對轉換率的關聯圖，尋找潛在關係","對不同購物路徑設定統計假設並進行雙樣本t 檢定"],"answer":2,"explanation":"官方公告標準答案：C。來源：114年第四梯次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"114年第四梯次","number":36},{"id":20036,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・人工智慧基礎概論・第37題】某金融科技公司在利用歷史交易資料建立風險控管模型時，嘗試推估 整體詐騙交易比例。近期發現，樣本間存在明顯的時間序列相關性，導 致模型在實際偵測新交易時誤判率升高。若希望同時改善詐騙比例推 估的準確性並提升模型的穩健性，下列哪一種做法最為合適？","options":["擴充樣本數量，以涵蓋更多潛在的詐騙型態，但維持既有的隨機抽 樣方式不變","採取時間序列敏感的抽樣策略，例如依據交易時間區間進行分層， 以保存原始的時間結構特性","將資料完全隨機打散，以降低序列相關性對模型訓練造成的影響","在模型評估時，針對相鄰時間區段進行誤差合併，以便用整體估計 方式修正詐騙比例"],"answer":1,"explanation":"官方公告標準答案：B。來源：114年第四梯次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"114年第四梯次","number":37},{"id":20037,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・人工智慧基礎概論・第38題】某公司建置基於檢索增強生成（RAG）的知識查詢系統，需同時兼顧查 詢效能與資料的即時更新。近期發現回應內容偶爾過時，且每次更新文 件都需完整重建索引，導致系統在更新期間無法服務。若要解決此問題 並提升整體穩健性，下列哪項做法最適合？","options":["調整生成模型的回應隨機性參數，以降低答案偏差並提升一致性","提升檢索與索引的運算效能，以縮短查詢與更新所需時間","採用索引的增量或分段更新方式，使新資料能即時納入而不需全部 重建","建立常見問題的標準答案集，透過快速檢索回應以降低模型負擔"],"answer":2,"explanation":"官方公告標準答案：C。來源：114年第四梯次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"114年第四梯次","number":38},{"id":20038,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・人工智慧基礎概論・第39題】某醫院計畫開發住院日數預測模型，以協助病房調度。多數病人的住院 日數集中在3–7 天，但仍有少數重症患者因治療需求而住院日數明顯 偏長。醫院希望採用一種合適的評估方式，既能兼顧大部分病人的預測 準確度，也能確保對重症個案的預測維持穩健。下列哪一種方法最符合 此需求？","options":["在模型檢核時，同時呈現平均絕對誤差（MAE）與重症子群的誤差指 標","僅針對一般病人樣本進行交叉驗證，以避免重症個案拉高誤差","將所有病人的住院日數進行標準化處理，以減少數值範圍差異的影 響","只採用單一的整體決定係數 (R²) 作為模型優劣的判斷依據"],"answer":0,"explanation":"官方公告標準答案：A。來源：114年第四梯次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"114年第四梯次","number":39},{"id":20039,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・人工智慧基礎概論・第40題】關於監督式學習（Supervised Learning ）與非監督式學習 （Unsupervised Learning）的目標，下列敘述何者錯誤？ 1.非監督式學習的核心在於發掘資料內在結構，例如分群、關聯規則與 降維，而不依賴外部標籤。 2.監督式學習的典型應用為分類與迴歸，通常不適合應用於異常偵測 任務。 3.非監督式學習若搭配少量標註資料，即會完全轉化為監督式學習。 4.監督式學習仰賴已標註的資料集，透過最小化輸出與真實標籤之間 的差距，學習輸入與目標之間的對應函數。 5.所有監督式學習任務都必須要有大量完整標註資料，否則無法進行 任何有效的模型訓練。 6.非監督式學習不需要目標變數，僅透過輸入資料本身的特徵分布進 行模式學習。","options":["3、5、6","1、4、6","2、4、6","2、3、5"],"answer":3,"explanation":"官方公告標準答案：D。來源：114年第四梯次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"114年第四梯次","number":40},{"id":20040,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・人工智慧基礎概論・第41題】一家旅遊平台希望建立模型，預測顧客下次是否會再次透過該平台訂 房。資料包含：顧客ID、年齡、旅遊次數、平均花費金額、主要交通 方式（火車/飛機/自駕/公車）、會員等級（普通/進階/白金）、是否為 海外旅遊等。下列哪一種特徵工程方法最適合處理「主要交通方式」欄 位？","options":["布林轉換（Boolean Conversion）","序數編碼（Ordinal Encoding）","數值標準化（Numerical Standardization）","One-hot 編碼（One-hot Encoding）"],"answer":3,"explanation":"官方公告標準答案：D。來源：114年第四梯次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"114年第四梯次","number":41},{"id":20041,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・人工智慧基礎概論・第42題】一家跨國醫療研究機構希望利用各地醫院的病患資料，建立一個能夠 預測疾病早期風險的機器學習模型。由於各國法規限制，病患的原始資 料無法集中到單一伺服器。在此情境下，下列哪一種方法最能同時滿足 「各醫院保留資料不外流」與「模型仍能跨院學習」的需求？","options":["資料匿名化（Data Anonymization）","差分隱私（Differential Privacy）","聯邦學習（Federated Learning）","交叉驗證（Cross-validation）"],"answer":2,"explanation":"官方公告標準答案：C。來源：114年第四梯次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"114年第四梯次","number":42},{"id":20042,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・人工智慧基礎概論・第43題】某公司欲建立員工離職風險預測模型，資料集中包含「年度績效分數」、 「平均每月加班時數」、「年齡」等數值型特徵。由於各特徵的數值範圍 差異極大（例如績效分數1–5、加班時數0–80、年齡20–65），若直 接輸入至使用梯度下降的邏輯迴歸(Logistic Regression)模型，可能 導致模型收斂緩慢或權重偏斜。為提升模型訓練效率與準確度，下列哪 一種特徵工程方法最適合應用於這些數值特徵？","options":["布林轉換（Boolean Conversion）","時間序列分解（Time Series Decomposition）","One-hot 編碼（One-hot Encoding）","數值標準化（Numerical Standardization）"],"answer":3,"explanation":"官方公告標準答案：D。來源：114年第四梯次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"114年第四梯次","number":43},{"id":20043,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・人工智慧基礎概論・第44題】在機器學習中，「叢集（Clustering）」方法最典型的應用情境是下列何 者？","options":["根據歷史交易紀錄與已標註的詐欺案例，訓練模型來偵測未來的詐 欺交易","使用醫療數據與病患的診斷標籤，建立模型以預測病人是否罹患特 定疾病","根據顧客的消費行為與特徵，將顧客自動劃分為數個群組，以便進 行差異化行銷","透過大量已標註影像，訓練深度學習模型來辨識照片中的物件種類"],"answer":2,"explanation":"官方公告標準答案：C。來源：114年第四梯次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"114年第四梯次","number":44},{"id":20044,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・人工智慧基礎概論・第45題】某醫院研究團隊蒐集了大量病患的「收縮壓」數據，經檢驗後顯示此數 值大致呈現常態分布。在進行後續模型分析前，研究人員希望妥善處理 可能存在的極端血壓數值。下列哪一種做法最為合適？","options":["將所有極端偏高或偏低的血壓數據直接刪除，以保留最具代表性的 病患樣本","使用對數轉換（Log Transformation），將數據壓縮至更接近常態， 以降低極端值的影響","透過Z 分數（Z-score）或標準差範圍檢測異常值，並依研究需求決 定是否調整或移除","將檢測到的離群值以Label Encoding 編碼，轉換為序號標籤以避 免影響原始分布"],"answer":2,"explanation":"官方公告標準答案：C。來源：114年第四梯次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"114年第四梯次","number":45},{"id":20045,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・人工智慧基礎概論・第46題】某電商公司想預測用戶是否會購買特定商品，資料中包含多種用戶屬 性與行為特徵。分析師希望選出對購買結果最有預測價值的特徵，以提 升模型效能。下列哪一種描述最符合監督式特徵選擇（Supervised Feature Selection）的概念？","options":["根據特徵的整體分布、變異度或資訊量進行篩選，而不直接參考目 標變數","評估每個特徵與目標變數之間的相關性，選擇對預測結果貢獻最大 的特徵","使用模型評估特徵對預測結果的重要性，並保留對目標變數影響較 大的欄位","將特徵透過降維方法（如PCA）轉換為新特徵，再用於模型訓練"],"answer":1,"explanation":"官方公告標準答案：B。來源：114年第四梯次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"114年第四梯次","number":46},{"id":20046,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・人工智慧基礎概論・第47題】在訓練神經網路時，為了提升模型收斂速度與穩定性，避免梯度消失或 梯度爆炸，下列哪一種做法最常被使用？","options":["對輸入資料進行隨機旋轉或水平翻轉，以增加資料多樣性","選用ReLU 或其變體作為隱藏層的啟動函數，以改善梯度傳播","減少樣本量提升訓練速度","對目標變數或特徵進行標準化"],"answer":1,"explanation":"官方公告標準答案：B。來源：114年第四梯次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"114年第四梯次","number":47},{"id":20047,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・人工智慧基礎概論・第48題】若希望檢視某一連續型數據的分布情形（如集中程度、偏態或是否呈現 多峰），下列哪一種應用情境最適合使用直方圖（Histogram） 來進行 分析？","options":["探討顧客年齡資料的整體分布特徵，並檢視是否存在異常集中或分 散現象","比較不同商品在各月份的銷售額變化趨勢，以觀察季節性波動","追蹤公司近一年營收的時間序列變化，以了解整體成長趨勢","檢視產品價格與月銷售量之間的關聯性，以評估是否具線性相關"],"answer":0,"explanation":"官方公告標準答案：A。來源：114年第四梯次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"114年第四梯次","number":48},{"id":20048,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・人工智慧基礎概論・第49題】下列何者並非我國數位發展部 AI 產品與評測中心在評估大型語言模 型安全性時，所指出的常見使用指標？","options":["資料複雜性","事實正確性","偏見與歧視","惡意與濫用可能性"],"answer":0,"explanation":"官方公告標準答案：A。來源：114年第四梯次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"114年第四梯次","number":49},{"id":20049,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・人工智慧基礎概論・第50題】某雲端服務公司計畫將大型語言模型部署於線上系統，並以批次推論 （Batch Inference）方式處理每日上百萬筆用戶請求。專案團隊在評 估可能遇到的挑戰時，下列哪一項通常不會被視為批次推論階段的主 要難題？","options":["如何確保訓練語料的涵蓋性與標註品質，以避免模型偏差影響輸 出","當批次規模增大時，如何降低推論延遲並保持即時回應能力","在推論過程中，有效管理與分配龐大的輸入資料量以避免資源壅 塞","在叢集環境中精確安排推論任務，以提升GPU/TPU 等硬體資源的利 用率 《以下空白》"],"answer":0,"explanation":"官方公告標準答案：A。來源：114年第四梯次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"114年第四梯次","number":50},{"id":20050,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第1題】在Low Code 平台的開發應用設計中，關於「模型（Model）」，下列敘述 何者最符合實際情況？","options":["模型僅扮演設計視覺化的輔助工具，對應用邏輯的影響有限","模型是用來抽象描述資料結構、業務流程與介面邏輯的核心元素， 影響應用的設計與維護","模型僅依循UML（Unified Modeling Language）等傳統建模方式， 缺乏針對Low Code 環境的延展性","模型在Low Code 平台中已被自動程式碼生成全面取代，實際價值 有限"],"answer":1,"explanation":"官方公告標準答案：B。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":1},{"id":20051,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第2題】企業在導入生成式AI 平台時，往往需要利用分散於不同部門或機構中 的大量敏感文本資料。若希望在確保隱私的前提下，仍能讓模型持續優 化並降低資料外洩風險，下列哪一種方法最適合？","options":["同態加密（Homomorphic Encryption）","安全多方計算（Secure Multi-party Computation）","零知識證明（Zero-knowledge Proofs）","聯邦學習（Federated Learning）"],"answer":3,"explanation":"官方公告標準答案：D。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":2},{"id":20052,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第3題】某企業利用No Code/Low Code 平台開發內部營運系統。為確保系統在 跨部門流程與外部服務整合下仍具良好的可測試性（Testability），下 列哪一項作法最為合適？","options":["依賴No Code/Low Code 平台提供的即時預覽與基本單元測試功能， 快速驗證常見流程","導入可重複執行的自動化測試流程，並透過 API 或服務虛擬化進 行模組化驗證","將測試聚焦於使用者介面互動與操作流程驗證，檢查系統表面功 能","依靠使用者回饋與正式上線後的監控資料，作為修正依據"],"answer":1,"explanation":"官方公告標準答案：B。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":3},{"id":20053,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第4題】某社交平台嘗試結合自動提示工程（Automatic Prompt Engineer, APE）與圖提示（Graph Prompting），讓AI 協助分析使用者之間的互動 關係。在這個過程中，下列何者為最可能遇到的挑戰？","options":["圖結構轉換為文字提示時，可能導致部分關聯資訊遺失","APE 在圖資料上無法產生任何提示內容","圖轉文字後能完整保留所有上下文，對推理不造成影響","Graph Prompting 僅能處理線性路徑，限制多分支探索"],"answer":0,"explanation":"官方公告標準答案：A。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":4},{"id":20054,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第5題】在超長上下文任務中使用自動提示工程（Automatic Prompt Engineer, APE）時，可能面臨的最大限制是什麼？","options":["迭代優化難以因應上下文的不斷變動，導致調整失效","模型的記憶容量有限，無法完整保留所有長篇資訊","提示內容難以有效分解，無法支援複雜任務拆解","回饋機制通常僅針對局部片段，難以全面評估最終輸出品質"],"answer":3,"explanation":"官方公告標準答案：D。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":5},{"id":20055,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第6題】某設計團隊計畫在短時間內完成一款行動應用程式，必須同時達到高 度個人化體驗、快速生成介面與行銷內容自動產出等需求。若結合 No Code/Low Code 平台與生成式AI 技術，以下哪一種整合策略最能符合 目標？","options":["使用生成式AI 自動產生API 呼叫與元件配置，並由開發者手動整 合至No Code 平台流程","透過生成式AI 在No Code 平台中自動建立介面模板，並結合使用 者數據即時生成個人化功能與行銷推播內容","在No Code 平台中導入生成式AI，快速建立跨專案可重用的通用模 組，專注於提升開發速度","在No Code 平台中完全依賴生成式AI 自動產生所有應用功能與流 程，不經人工設計或驗證"],"answer":1,"explanation":"官方公告標準答案：B。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":6},{"id":20056,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第7題】某團隊希望讓AI 自動查詢GitHub 上的程式碼庫，並生成摘要給使用 者參考。開發者決定透過Model Context Protocol（MCP）來實現，AI 需先發出請求，再經由MCP 架構逐步完成查詢與回傳。在此情境下， MCP 運作流程的正確順序為何？","options":["MCP Server→AI Host→MCP Client→資料查詢→結果回傳AI Host","MCP Client→AI Host→MCP Server→資料查詢→結果回傳AI Host","AI Host→MCP Client→ MCP Server→資料查詢→結果回傳AI Host","AI Host→MCP Server→MCP Client→資料查詢→結果回傳AI Host"],"answer":2,"explanation":"官方公告標準答案：C。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":7},{"id":20057,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第8題】在Agent-to-Agent（A2A）架構中，不同代理人之間會分工合作。一般 而言，下列敘述何者最符合Client Agent 與Remote Agent 的互動流 程？","options":["Remote Agent 主動分派任務給Client Agent","由人工事先設定Client Agent 與Remote Agent 處理任務的先後順 序","Client Agent 發起任務，Remote Agent 執行並回傳結果","Client Agent 與Remote Agent 同時處理任務並同步處理結果"],"answer":2,"explanation":"官方公告標準答案：C。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":8},{"id":20058,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第9題】在導入生成式AI 的應用規劃中，上下文工程（Context Engineering） 的核心目的為何？","options":["縮短模型訓練時間","優化提示與上下文","增加模型參數數量","優化Fine-tuning 正確率"],"answer":1,"explanation":"官方公告標準答案：B。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":9},{"id":20059,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第10題】某公司在導入生成式AI 協助撰寫內部報告時，測試人員刻意在輸入的 上下文中放入互相矛盾的資訊（例如：同一位員工在不同段落被描述為 「入職三年」與「入職五年」）。在這種情況下，最常見的模型行為會是 什麼？","options":["永遠選擇第一段資訊作為答案依據","可能生成幻覺或隨機採信其中一方的內容","拒絕回答，並要求提供更一致的輸入","自動判斷並只選擇正確的資訊"],"answer":1,"explanation":"官方公告標準答案：B。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":10},{"id":20060,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第11題】Agentic AI 在解決方案圖譜（Solution Graph）上尋找最佳解決路徑 時，通常會使用什麼樣的搜尋策略？","options":["使用廣度優先、深度優先或最佳優先等演算法進行探索","每一步都隨機選擇動作，反覆嘗試直到找到一條可行路徑","只執行事先假定的一條路徑，失敗就停止","完全依靠LLM 一次性推斷最優完整路徑"],"answer":0,"explanation":"官方公告標準答案：A。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":11},{"id":20061,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第12題】某企業考慮將開源大型語言模型（GPT-OSS）自行部署在本地伺服器， 以取代雲端服務。下列何者最能代表本地部署對企業的實際好處？","options":["可以達到無運算成本，因為本地部署模型不會產生額外的資源消 耗","模型的預測能力會比在雲端運行時更精度，因為本地環境更加可 靠","可確保輸入模型的敏感資料不會傳輸給第三方，提升資料隱私和自 主控制","以上皆是"],"answer":2,"explanation":"官方公告標準答案：C。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":12},{"id":20062,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第13題】關於GitHub Copilot，下列敘述何者正確？","options":["GitHub Copilot 基於程式碼片段查詢工具，透過後端搜尋大型程式 碼資料庫提供建議","GitHub Copilot 僅適用於GitHub 上的開源專案，無法在私有程式 碼庫或本地環境中提供程式碼補全建議","GitHub Copilot 利用靜態分析技術分析程式碼，根據邏輯流程推導 下一步應寫的程式碼","GitHub Copilot 由OpenAI 的Codex 模型提供技術支援，可即時在 開發者編輯程式碼時給出整行或整個函式建議"],"answer":3,"explanation":"官方公告標準答案：D。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":13},{"id":20063,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第14題】某電商公司導入Agentic AI 來處理客服工作。測試發現Agent 在回答 產品FAQ 時經常出錯，且無法幫客戶修改訂單。這種情況最可能是因 為缺少下列哪兩項工具或技術？","options":["API 調用（API Calling）＋ 任務規劃器（Task Planner）","向量資料庫檢索（Vector Retrieval）＋API 調用（API Calling）","向量資料庫檢索（Vector Retrieval）＋任務規劃器（Task Planner）","任務規劃器（Task Planner）＋溫度參數（Temperature）設定"],"answer":1,"explanation":"官方公告標準答案：B。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":14},{"id":20064,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第15題】某客服自動回應系統希望根據不同客戶群體調整回覆風格。在兼顧即 時性與效果的前提下，下列哪一種方案最適合？","options":["直接微調預訓練模型針對每個客戶群體分別訓練不同風格模型","利用控制變量（Control Tokens）或風格標籤在同一模型內動態調 整風格","利用生成對抗網路（GAN）生成不同風格文本，並透過人工篩選最終 答案","採用規則式替換方法，替換回覆詞彙以符合不同風格要求。"],"answer":1,"explanation":"官方公告標準答案：B。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":15},{"id":20065,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第16題】在建置多代理大型語言模型（Multi-agent LLMs）系統時，如果沒有清 楚定義每個代理的任務啟動條件和角色分工，最可能出現什麼問題？","options":["回覆內容前後不連貫，系統邏輯斷裂","不同代理的答案互相衝突，無法判斷最終決策","系統陷入無限對話循環，導致資源耗盡","多個代理重複做同樣的任務，造成效率低落"],"answer":3,"explanation":"官方公告標準答案：D。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":16},{"id":20066,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第17題】某公司部署結合 Fine-tuning 與檢索增強生成（RAG）的語言模型系統 作為內部文件助理。系統需同時確保回覆語氣一致、能即時查詢每日新 增文件、維持效能穩定，並避免頻繁重新訓練。在長期維護與效能平衡 下，下列哪一種策略最合適？","options":["每週重新Fine-tune 模型，將新文件整合進模型知識，逐步取代RAG 模組","完全依靠基礎模型與RAG，不進行Fine-tune，僅透過提示設計控 制語氣","每日進行增量Fine-tune，讓模型即時學習新文件內容，避免依賴 檢索","保留語氣相關Fine-tuning，僅透過檢索系統更新文件內容，不頻 繁改動模型"],"answer":3,"explanation":"官方公告標準答案：D。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":17},{"id":20067,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第18題】某客服系統在回覆「訂單取消政策」時，即使生成溫度固定為 0.6，回 覆品質仍常出現差異。調查顯示，檢索到的政策內容有時是最新版本， 有時則是過時文件，此外Prompt 約束不足，微調語料也有模糊描述。 若要優先改善品質波動，應先解決下列哪一項問題？","options":["調整溫度參數，降低生成隨機性","加強Prompt 設計，限制模型表達方式","優化微調語料，減少含糊描述","提升檢索系統品質，確保取得的政策內容正確且最新"],"answer":3,"explanation":"官方公告標準答案：D。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":18},{"id":20068,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第19題】某醫院導入了一套智慧系統，由三個模組構成：語音辨識（ASR） → 語 言模型生成（LLM） → 查詢醫療資料庫 API。近期發現部分查詢結果 錯誤，例如醫師詢問「術後復健流程」時，系統卻誤判為要查詢「術前 注意事項」，因此查詢到錯誤的文件。經檢查已排除語音辨識的錯誤， 下列何者最可能是造成查詢錯誤的來源？","options":["醫療資料庫API 對應規則設計不清，造成意圖映射模糊","LLM 的Prompt 缺乏明確指示，導致語意分類判斷錯誤","查詢API 回傳速度過慢，影響系統處理正確性","LLM 未經醫療領域微調，難以正確理解專業性詞彙"],"answer":1,"explanation":"官方公告標準答案：B。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":19},{"id":20069,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第20題】某醫院正在規劃一個AI 專案，目的是協助醫師從胸腔X 光影像中判斷 是否存在肺炎徵兆，團隊卻誤將生成式 AI 模型運用於影像診斷。下列 哪一項最可能成為主要風險？","options":["模型在生成報告時語句流暢，但僅在文字表達上有差異，對診斷結 果沒有重大影響","模型若資料不足，僅會降低生成報告的完整性，而非影響判斷病灶 的正確性","模型偏向生成內容而非分類，但此差異僅影響效率，不會造成誤診 風險","模型可能生成與實際影像不符的診斷結論，導致誤判並引發醫療與 法律風險"],"answer":3,"explanation":"官方公告標準答案：D。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":20},{"id":20070,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第21題】某公司開發的智慧車載語音助理，可透過語音辨識（ASR）辨識駕駛語 音，再由LLM 生成回答並查詢車載 API。測試中發現：ASR 對汽車專 業術語辨識錯誤率高；LLM 的回覆常不精確；系統回覆延遲雖存在但仍 可接受。若目標是「優先提升準確性與回答品質」，下列改進步驟的最 合理執行順序為何？ 1. 擴充並標註汽車領域語音資料，微調 ASR 模型 2. 微調 LLM 並加入檢索增強（RAG） 3. 優化系統架構，引入批次推論降低延遲 4. 動態調整生成溫度，平衡準確度與多樣性","options":["1 → 2 → 4 → 3","2 → 1→ 3 → 4","1 → 3 → 2 → 4","3 → 1 → 2 → 4"],"answer":0,"explanation":"官方公告標準答案：A。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":21},{"id":20071,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第22題】一家顧問公司使用生成式AI 協助撰寫數據分析報告。雖然模型在測試 中表現優異，但其生成的報告多半僅遵循固定段落結構，替換數值或關 鍵詞即可完成，卻未能展現針對不同專案的多樣化推理與分析。下列何 者為造成這種現象的最合理解釋？","options":["模型在生成過程中缺乏對字體與排版的優化能力，因此無法展現分 析邏輯","測試資料涵蓋過多統計圖表，導致模型無法專注於文字內容的多樣 化表達","模型過度依賴訓練語料中的常見報告範式，導致生成結果以樣板化 結構取代真正的推理","模型因無法正確辨識報告中的頁碼與標題層級，才出現樣板化的結 果"],"answer":2,"explanation":"官方公告標準答案：C。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":22},{"id":20072,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第23題】在應用零樣本提示（Zero-Shot Prompting）時，下列哪一種情境最可 能因缺乏示範而失敗，出現語意錯誤或結構錯誤的輸出？","options":["要求模型判斷一段影評文字的情感傾向","要求模型將一段新聞摘要濃縮為一句話","要求模型將一段繁體中文翻譯成英文","要求模型從表格中擷取所有城市的最高氣溫"],"answer":3,"explanation":"官方公告標準答案：D。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":23},{"id":20073,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第24題】某保險公司計畫導入生成式AI 的內部合約查詢系統，協助業務員與法 務部門快速解讀保單條款與理賠規範。高層特別強調客戶資料隱私與 合規風險控管，即使需要投入較多資源，也必須確保資料不會外洩。在 此情況下，下列哪一種策略最符合公司的資料安全與合規優先考量？","options":["導入開源模型並由IT 團隊自建，後續再逐步補強隱私與合規控管","在需求確認階段即納入法遵與稽核單位，設定準確率KPI，並透過 MVP 驗證成效","優先使用雲端大型API 模型快速部署，並根據使用數據持續調整","投入資源自訓並私有化部署LLM，並同步建立自動化風控機制"],"answer":3,"explanation":"官方公告標準答案：D。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":24},{"id":20074,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第25題】某新創公司開發一套圖像描述生成系統，能根據輸入的照片自動產生 說明文字。為了讓產生的描述文字能與圖片資訊精準對應，下列哪一種 設計思路最關鍵？","options":["強化語言模型的句法與流暢性，確保生成文字更自然易讀","在生成過程中結合圖片特徵與語言建模，讓模型同時利用影像內容 與文字資訊","調整生成策略（如 Beam Search 或溫度參數），以提升輸出文字的 合理性","專注於文字序列上下文的建模，只提升文字間的連貫性"],"answer":1,"explanation":"官方公告標準答案：B。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":25},{"id":20075,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第26題】某電商平台希望生成的商品描述在風格與用詞上保持一致性，但不需 要新增專業知識。下列哪種方法最適合？","options":["擴充語料庫並微調模型，使風格統一","增加提示詞複雜度，引導模型風格一致","降低生成溫度，以減少隨機性並提升風格一致性","使用全連接神經網路對生成結果後期篩選"],"answer":2,"explanation":"官方公告標準答案：C。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":26},{"id":20076,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第27題】某企業已建置AI 語音記錄系統，並希望整合生成式AI 進行「會議即 時摘要」功能，下列哪一種策略最能提升摘要的語意品質與使用價值？","options":["使用語音轉文字模型即時輸出逐字稿並轉入GPT 摘要","將語音逐段切分並建立關鍵字索引，以利摘要模型從中擷取核心內 容生成會議重點","將語音轉文字後標註發言角色與主題邊界，結合語意分群進行動態 摘要","將所有語音內容儲存為完整紀錄，提供事後人工摘要比對用"],"answer":2,"explanation":"官方公告標準答案：C。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":27},{"id":20077,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第28題】某公司正在開發一個智慧客服系統，負責回覆顧客關於退換貨、優惠活 動與商品建議等問題。研發團隊嘗試使用不同的提示設計方式來提升 模型效能。下列哪一個提示最符合「少樣本提示（Few-Shot Prompting）」 的設計原則？","options":["「請回答顧客詢問：如何申請退貨？」","「以下是兩組客服對話範例，請依照相同風格回覆新的顧客問題」","「請逐步分析顧客投訴的原因，並依照推理過程生成合適回覆」","「請以正式的語氣回覆顧客的提問」"],"answer":1,"explanation":"官方公告標準答案：B。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":28},{"id":20078,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第29題】某投資公司導入生成式 AI，用於即時分析股市波動並提供市場背景資 訊。若希望AI 能兼顧「即時性」與「可靠性」。下列哪一項設計最能有 效提升AI 在即時股市分析上的表現？","options":["將AI 系統連結至公司內部歷史交易資料庫，以便快速調用既有的 案例參考","調整模型的回應邏輯，讓AI 優先輸出最新市場行情，而不是完整 的背景分析","建立與外部即時行情來源同步的查詢模組，確保AI 能即時擷取最 新金融數據","增加訓練資料中模擬的金融危機與市場異常案例，以提升AI 在特 殊情境下的表現能力"],"answer":2,"explanation":"官方公告標準答案：C。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":29},{"id":20079,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第30題】某大型物流公司計畫導入AI 系統，以改善客服與配送作業的效率。專 案團隊規劃了以下四個步驟，請問正確的執行順序為何？ 1. 建立符合公司服務流程的AI 對話邏輯與應答範本，確保顧客體驗 一致 2. 明確定義導入AI 的目標並設定關鍵績效指標（KPI） 3. 蒐集與清理過往客服紀錄與配送相關資料，作為模型訓練素材 4. 評估並選擇合適的AI 技術供應商或開源方案，確立技術方向與架 構","options":["2 → 3 → 4 → 1","3 → 2 → 1 → 4","2 → 1 → 3 → 4","1 → 4 → 3 → 2"],"answer":0,"explanation":"官方公告標準答案：A。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":30},{"id":20080,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第31題】某跨國電商企業導入生成式AI，協助處理顧客服務請求，並根據顧客 歷史訂單提供個人化建議。資安與法遵部門擔心AI 在回覆時可能洩漏 顧客個資，若要在導入初期優先避免觸法風險，下列哪一項措施最符合 要求？","options":["在加密環境下導入完整的顧客訂單與行為資料，並透過嚴格存取控 管降低洩漏風險","實施資料最小化與去識別化，確保AI 在訓練與生成過程中不直接 處理或暴露敏感個資","強化模型的回覆審查流程，透過自動過濾與人工抽查結合，降低個 資外洩的機率","設定AI 的角色與回覆範圍，讓其專注於客服相關內容，避免回答 其他敏感議題"],"answer":1,"explanation":"官方公告標準答案：B。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":31},{"id":20081,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第32題】某國際銀行導入生成式AI，用於彙整不同國家金融監管機構的合規規 範，建立跨國合規知識庫。由於各國條文表述方式不同，且監管要求具 有高度專業性與隱含邏輯，若要確保知識庫在後續查詢與生成報告時 能維持正確性與一致性，下列哪一項AI 能力最為關鍵？","options":["具備跨語言專業術語對齊與條文語意抽取能力，能正確辨識不同國 家規範間的對應與差異","能自動最佳化文件檢索效率，縮短跨國法規查詢的延遲時間，提升 合規部門使用體驗","能將合規文件轉換為多種輸出形式（如簡報、摘要或法規清單），以 符合不同決策層級需求","具備根據歷史案例生成合規解釋的能力，協助新進員工快速理解法 規在實務上的應用"],"answer":0,"explanation":"官方公告標準答案：A。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":32},{"id":20082,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第33題】在企業導入MLOps（Machine Learning Operations）的過程中，除了 模型部署與維運挑戰外，仍可能面臨其他推動上的困難。下列何者為 No Code 平台最能有效解決的挑戰？","options":["自動化大量資料的標註與前處理，以降低數據準備成本","提升運算基礎設施的可擴展性，以因應大規模服務需求","透過可視化建模介面，降低技術門檻並促進跨部門協作","提供進階特徵工程能力，優化高維度數據的處理效率"],"answer":2,"explanation":"官方公告標準答案：C。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":33},{"id":20083,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第34題】某醫療機構計畫導入生成式AI 協助撰寫病歷摘要。在技術測試階段， 為確保系統能安全應用於臨床，最應優先關注下列哪一項指標？","options":["資料儲存與存取架構的完整性，確保長期運作過程中的數據可追溯 性","生成內容的醫療準確性與臨床一致性，避免出現錯誤或誤導性資 訊","模型在不同病例語境下的泛化能力，確保不因個別樣本而偏差","系統回應時間的穩定性，以支援醫療場域中可能的即時需求"],"answer":1,"explanation":"官方公告標準答案：B。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":34},{"id":20084,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第35題】在即時客服系統的效能測試中，若針對延遲測試（Latency Testing） 進行評估，下列哪一項指標最能反映系統是否符合用戶即時互動需 求？","options":["AI 模型在同一分鐘內可完成的回覆訊息數量","客戶從輸入問題到收到第一個完整回應所需的時間","客服系統能連續提供服務的運行時長","AI 產生回答時用詞的多樣性與表達創意程度"],"answer":1,"explanation":"官方公告標準答案：B。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":35},{"id":20085,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第36題】某航空公司導入生成式AI 聲控客服，提供航班與票務查詢。有人員透 過惡意提示，試圖讓系統洩漏內部安檢流程。在此情境中，下列何者為 降低提示攻擊（Prompt Injection）風險的最佳策略？","options":["導入輸入檢測與回應審核流程，防止敏感指令被執行","限制AI 可回應的主題範圍，使系統僅回答非敏感的航班與票務查 詢，避免處理內部或敏感流程資訊","隨機變化回覆內容，讓攻擊者難以預測回應行為以增加攻擊難度","擴充與更新航班與票務資料來源，以提升模型的知識正確性與覆蓋 率"],"answer":0,"explanation":"官方公告標準答案：A。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":36},{"id":20086,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第37題】在機器學習模型的實務應用中，常會出現數據漂移（Data Drift）的情 況。此現象主要是指下列哪一種情況？","options":["訓練時使用的資料分佈，與部署後實際輸入資料的統計特徵隨時間 逐漸出現差異，導致模型表現衰退","在資料前處理過程中，因特徵刪減或缺失補值不當，造成樣本資訊 量下降","模型對訓練數據擬合過度，在未知數據上泛化能力不足","後端資料庫因欄位定義或結構調整，導致特徵提取流程與原始設計 不一致"],"answer":0,"explanation":"官方公告標準答案：A。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":37},{"id":20087,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第38題】某銀行導入生成式AI 放貸審核系統，用於分析申貸人條件並生成初步 審核意見。測試過程中發現，模型對不同族群的核准率存在顯著差異， 可能引發演算法偏見問題。為降低此風險，下列哪一項措施最合適？","options":["提升模型運算速度與效能，以確保在大量申請中快速回應","全面移除與申貸人身份相關的敏感屬性，避免模型因變數影響而產 生偏差","導入資料與結果的公平性檢測流程，並依合規規範調整模型或決策 邏輯","減少訓練樣本數量，降低偏見被放大的可能性"],"answer":2,"explanation":"官方公告標準答案：C。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":38},{"id":20088,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第39題】在提示工程（Prompt Engineering）的應用中，Chain-of-Thought（CoT） 與Tree of Thoughts（ToT）各適用於不同的推理情境，請問以下兩個 情境，分別最適合採用哪一種方法？ 情境一：電商公司開發客服助理，用來協助客戶查詢退款流程與相關規 範 情境二：活動策劃團隊使用AI 協助規劃多場跨部門行銷活動，需要同 時考量預算、場地、時程與人力資源，並比較不同方案的可行性。","options":["情境一採用CoT，情境二採用ToT","情境一採用ToT，情境二採用CoT","情境一與情境二都適合CoT","情境一與情境二都適合ToT"],"answer":0,"explanation":"官方公告標準答案：A。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":39},{"id":20089,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第40題】在生成式AI 的提示工程中，Graph Prompting 在處理複雜關係資料時， 為何通常比Chain-of-Thought（CoT）更有效？","options":["Graph Prompting 幾乎不需要推理，只依靠圖結構即可得出結論","Graph Prompting 僅需單次提示，即可避免多輪推理的誤差累積","Graph Prompting 的生成速度通常更快，因此效率更高","Graph Prompting 能捕捉非線性結構與上下文關聯，適合處理網絡 化資訊"],"answer":3,"explanation":"官方公告標準答案：D。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":40},{"id":20090,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第41題】在少樣本提示（Few-shot Prompting）僅能提供 1–2 個範例的情況 下，若遇到領域偏移（Domain Shift），下列何者為模型最可能面臨的 核心挑戰？","options":["範例數量過少，無法涵蓋新領域的多樣性，導致模型泛化不足","範例表徵有限，模型容易依賴單一樣本特性而降低適應力","範例覆蓋不足，使模型難以抽取跨領域的穩定模式","範例資訊過於稀缺，模型缺乏應對不同輸入情境的能力"],"answer":0,"explanation":"官方公告標準答案：A。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":41},{"id":20091,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第42題】某金融機構導入檢索增強生成（Retrieval-Augmented Generation, RAG）模型，用於客服文件查詢與自動回覆。由於大型模型運算成本過 高，若考慮引入知識蒸餾（Knowledge Distillation, KD）技術，下列 何者為帶來的主要效益？","options":["讓小型模型學習大型模型的知識，在降低運算成本的同時維持檢索 與生成品質","只能應用於語音或影像辨識，無法提升文字檢索生成效能","因為RAG 已有檢索機制，因此無需額外蒸餾知識","僅能依賴特定 API 供應商才能使用，無法在自建模型中實現"],"answer":0,"explanation":"官方公告標準答案：A。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":42},{"id":20092,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第43題】在評估大型語言模型，例如7B、13B、175B 參數規模時，模型規模對基 準測試（Benchmark）結果的影響，下列哪一種說法最為恰當？","options":["小模型在正確調整下能超越大模型，因此模型大小並不重要","大模型在多數情境下表現較好，但在特定任務上略遜於小模型","模型規模與基準測試結果完全無關，影響主要來自測試設計","模型越大，Benchmark 結果可能提升，但幅度取決於訓練數據品質 與資源配置"],"answer":3,"explanation":"官方公告標準答案：D。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":43},{"id":20093,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第44題】在AI 應用設計中，Model Context Protocol（MCP）與檢索增強生成 （RAG）都能擴展模型的能力，但兩者的核心差異主要為下列何者？","options":["MCP 擴展模型工具，但主要用於補足訓練資料不足","MCP 能標準化連接資源，但仍需依賴向量資料庫","RAG 常用於擴展知識庫內容，而MCP 更著重於動態工具與API 呼叫 的整合","RAG 透過統一協議，提升回答相關性"],"answer":2,"explanation":"官方公告標準答案：C。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":44},{"id":20094,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第45題】下列哪一個資料集專門設計用於測試大型語言模型在多領域、多任務 語言理解中，涵蓋人文、科學與社會科學等領域，而非專門用於數學推 理或中文專業知識？","options":["MMLU","GSM8K","MATH","C-Eval"],"answer":0,"explanation":"官方公告標準答案：A。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":45},{"id":20095,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第46題】某智慧工廠導入生成式AI，協助產線工程師即時產生維修指引與操作 建議。下列哪一項並非團隊在系統設計中加入Guardrails（防護機制） 的主要目的？","options":["檢查工程師輸入內容，避免觸發錯誤或危險需求","過濾與驗證AI 輸出的維修指引，確保符合安全標準","確保生成的操作建議符合法規與產業安全規範","完整重建並追蹤 AI 模型的全部推理過程"],"answer":3,"explanation":"官方公告標準答案：D。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":46},{"id":20096,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第47題】某顧問公司導入生成式AI，協助團隊快速檢索並摘要長篇的法規文件。 為了改善檢索結果常出現不相關或過於分散內容的問題，下列何者為 團隊決定對文件進行文本切分（Chunking）的主要目的？","options":["讓模型在回答時能加快推理速度","提高檢索相關性與降低長上下文噪音","降低系統記憶體和硬體資源的負擔","使模型在生成回覆時更具創造性與多樣化"],"answer":1,"explanation":"官方公告標準答案：B。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":47},{"id":20097,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第48題】某開發團隊在建置企業內部知識檢索系統時，選擇採用多向量檢索器 （Multi-vector Retriever），下列何者為協助提升系統查詢的完整性 與精準度的主要方式？","options":["支援同時處理多種資訊表示，提升跨文本型態的檢索效果","透過多向量壓縮與共享權重方式，降低檢索過程的運算與儲存成 本","以切分並過濾文件片段，減少上下文長度帶來的Token 負擔","透過調整生成階段的溫度參數，使模型在回覆時更穩定一致"],"answer":0,"explanation":"官方公告標準答案：A。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":48},{"id":20098,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第49題】在Agentic AI 的架構中，解決方案圖譜（Solution Graph）常被用來 輔助代理的任務執行，其主要作用為何？","options":["透過圖形結構完全取代大型語言模型的推理，讓代理只依靠圖演算 法完成任務","僅用於保存代理的輸出結果，方便後續檢視與審計，而不影響實際 推理流程","將代理限制在既定流程內，避免其產生偏離設計腳本的行為","作為代理在執行過程中的參考框架，用於組織決策步驟並支援任務 推理"],"answer":3,"explanation":"官方公告標準答案：D。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":49},{"id":20099,"category":"官方公告試題｜114年第四梯次","question":"【114年第四梯次・生成式AI應用與規劃・第50題】小明想開發一個部落格寫作工具，讓用戶輸入文章開頭後，系統自動幫 忙寫出後續內容，例如輸入「今天去了台北木柵動物園...」，系統就能 續寫。若要實現這樣的功能，最適合選擇下列哪一類任務？","options":["序列到序列建模（Sequence-to-Sequence Modeling），透過輸入序 列產生新的輸出序列","遮罩語言建模（Masked Language Modeling），補齊文字中缺失的 詞語或片段","生成式語言建模（Text Generation），依據上下文持續產生新的內 容","文本分類（Text Classification），針對輸入文本判斷情感、主題 或標籤 《以下空白》"],"answer":2,"explanation":"官方公告標準答案：C。來源：114年第四梯次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"114年第四梯次","number":50},{"id":20100,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第1題】下列何者不屬於資料整合（Data Integration）的主要目的？","options":["統一不同來源資料的格式與欄位定義，以確保分析一致性","識別並處理重複資料，避免影響模型訓練結果","整併多來源資料，以提升資料完整性與應用價值","依資料保存政策延長原始資料留存期限，以利未來可能的分析需求"],"answer":3,"explanation":"官方公告標準答案：D。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":1},{"id":20101,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第2題】某智慧城市專案導入AI 技術，以優化垃圾收集路線調度並即時監測空氣品質變 化。系統需持續蒐集環境數據（如 PM2.5、氣體濃度）與設備狀態（如垃圾桶滿 溢度）。下列何種技術最直接支援上述需求？","options":["專家系統（Expert System）","決策支援系統（Decision Support System）","啟發式決策引擎（Heuristic Decision Engine）","感知器網路（Sensor Network）"],"answer":3,"explanation":"官方公告標準答案：D。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":2},{"id":20102,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第3題】下列何者不符合非監督式學習（Unsupervised Learning）的典型特徵？","options":["模型可依據資料中的特徵相似性進行自動分群","訓練過程中不需仰賴事先定義的標籤資料","常用於探索資料的潛在結構或隱含模式","模型主要學習輸入特徵與既定目標標記之間的對應關係"],"answer":3,"explanation":"官方公告標準答案：D。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":3},{"id":20103,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第4題】某保險公司建立AI 理賠金額預測模型。歷史理賠資料經檢定後呈近似常態分佈， 但仍存在少數極端高額案件。資料科學團隊在不破壞整體分佈特性的前提下，規 劃進行離群值處理。下列何者最不適當？","options":["依統計準則（如Z-score 或IQR）評估後，再決定是否調整或處理極端值","採用截尾（Trimming）處理極端值，以提升模型穩定性","使用One-hot 編碼（One-hot Encoding）將離群值轉換為類別特徵以改善數值穩 定性","結合領域知識評估其合理性，再決定保留或修正"],"answer":2,"explanation":"官方公告標準答案：C。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":4},{"id":20104,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第5題】某銀行建立AI 詐欺交易偵測模型。歷史交易資料中，詐欺樣本比例極低，導致模 型訓練時偏向預測為「正常交易」。資料科學團隊評估採用SMOTE（Synthetic Minority Over-sampling Technique）改善訓練資料分佈。下列何者最符合SMOTE 技術的主要功能？","options":["透過隨機刪除部分正常交易資料，以降低類別失衡程度","依據少數類別樣本的特徵空間，合成產生新的少數類別樣本","調整模型的損失函數（Loss Function）權重，使誤判少數類別時的懲罰提高","以交叉驗證（Cross-validation）方式重新分割資料集，使各折資料類別比例一 致"],"answer":1,"explanation":"官方公告標準答案：B。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":5},{"id":20105,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第6題】資料科學團隊在模型訓練前，需對數值特徵進行正規化（Normalization）或標準 化（Standardization）。為確保模型評估結果具真實性並避免資料洩漏（Data Leakage），下列何者為最適當的作法？","options":["於資料分割前，先對完整資料集計算統計量並進行標準化處理","先分割訓練資料（Training Data）和測試資料（Test Data），並各自獨立計算 統計量後進行標準化","先分割訓練資料（Training Data）和測試資料（Test Data），僅以訓練資料計算 統計量，再套用至測試資料","僅對訓練資料（Training Data）進行標準化處理，測試資料（Test Data）保持原 始數值"],"answer":2,"explanation":"官方公告標準答案：C。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":6},{"id":20106,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第7題】某電信公司建立機器學習模型預測用戶流失風險。資料中包含多個類別型特徵 （Categorical Features），例如「資費方案類型」與「客戶地區」。為使模型能有效 使用這些特徵，下列何者最直接用於將類別型特徵轉換為模型可處理的數值格 式？","options":["資料分群（Data Clustering）","特徵交叉（Feature Cross）","One-hot 編碼（One-hot Encoding）","寬深模型（Wide and Deep）"],"answer":2,"explanation":"官方公告標準答案：C。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":7},{"id":20107,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第8題】某零售企業在建置機器學習模型預測顧客購買機率時， 資料同時包含大量稀疏類 別特徵與數值型特徵。 團隊希望模型既能學習過去已出現的特徵組合規律，也能 對未出現的特徵組合做出合理預測。 下列哪一種模型架構最適合此類需求？","options":["線性迴歸（Linear Regression）","決策樹（Decision Tree）","支援向量機（Support Vector Machine, SVM）","寬深模型（Wide and Deep）"],"answer":3,"explanation":"官方公告標準答案：D。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":8},{"id":20108,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第9題】某影音串流平台建立神經網路模型，用於預測使用者最可能感興趣的影片類型。 模型輸出層需將結果轉換為各類別的機率分佈，以便系統依機率高低推薦內容。 下列哪一種函數最適合用於模型輸出層？","options":["Softmax 函數（Softmax Function）","Sigmoid 函數（Sigmoid Function）","線性函數（Linear Function）","ReLU 函數（Rectified Linear Unit Function）"],"answer":0,"explanation":"官方公告標準答案：A。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":9},{"id":20109,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第10題】某設計公司導入生成式AI（Generative AI）工具，用於自動產生產品概念圖與風 格草圖。為了讓系統能依據既有圖像資料產生具有變化且風格一致的新圖像，模 型必須具備學習資料特性並生成新樣本的能力。下列哪一種模型技術或方法最符 合上述需求？","options":["隱變量自編碼器（Variational Autoencoder, VAE）","隨機森林（Random Forest）","K-近鄰演算法（K-Nearest Neighbors, KNN）","貝氏網路（Bayesian Network）"],"answer":0,"explanation":"官方公告標準答案：A。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":10},{"id":20110,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第11題】某企業導入生成式AI（Generative AI）系統自動產出會議摘要，並規劃額外建置 一套AI 系統，用於評估摘要內容的正確性與完整性。下列何者為此AI 系統的核 心目標？","options":["自動新增專業名詞與技術指標","判斷摘要是否遺漏關鍵資訊或出現語意錯誤","調整語音轉文字結果","自動標註摘要的關鍵字與主題標籤"],"answer":1,"explanation":"官方公告標準答案：B。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":11},{"id":20111,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第12題】ChatGPT、Gemini 等對話型生成式AI 工具所依據的基礎模型技術，下列何者正 確？","options":["決策樹（Decision Tree）","大型語言模型（Large Language Model, LLM）","生成對抗網路（Generative Adversarial Network, GAN）","圖卷積網路（Graph Convolutional Network, GCN）"],"answer":1,"explanation":"官方公告標準答案：B。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":12},{"id":20112,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第13題】根據《金融機構運用人工智慧技術作業規範》，金融機構於使用人工智慧提供金融 服務並直接與消費者互動時，下列何者非必要揭露之資訊？","options":["該服務之 AI 模型原始程式碼","服務適用對象與用途範圍","該服務是否為 AI 自動完成","該服務是否提供替代方案"],"answer":0,"explanation":"官方公告標準答案：A。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":13},{"id":20113,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第14題】下列哪一項「AI 技術應用與產業領域」的對應最為恰當？","options":["利用AI 分析商場顧客購買紀錄以預測股票市場波動—智慧交通","使用AI 進行設備故障預測與預防性維護—智慧製造","以 AI 模型融合即時氣象資料與乘客消費行為特徵，推薦會員升級優惠方案— 智慧醫療","利用 AI 分析社群媒體互動以提升臨床診斷準確度—金融服務業"],"answer":1,"explanation":"官方公告標準答案：B。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":14},{"id":20114,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第15題】在資料處理中，下列何者屬於「結構化數據」的例子？","options":["儲存在MySQL 資料庫中的訂單記錄","以JSON 格式儲存的商品訂單資訊","用XML 標註的產品目錄","儲存在純文字檔案中的客服對話紀錄"],"answer":0,"explanation":"官方公告標準答案：A。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":15},{"id":20115,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第16題】關於敘述性統計指標，下列敘述何者最為正確？","options":["中位數（Median）能有效反映極端值對資料分佈的影響","標準差（Standard Deviation）越大，代表資料越集中","百分位數（Percentile）主要用於衡量資料在整體分布中的相對位置","平均值（Mean）適合描述偏態且包含離群值（Outliers）的資料"],"answer":2,"explanation":"官方公告標準答案：C。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":16},{"id":20116,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第17題】某企業資料分析人員需針對不同型態的數據選擇合適的視覺化工具。下列哪一種 情境最適合使用直方圖（Histogram）？","options":["檢視顧客年齡資料在不同區間的集中情形","分析產品售價與銷售量之間的關聯程度","比較各產品類別的年度銷售總額","在地圖上標示各縣市加盟店的地理分布位置"],"answer":0,"explanation":"官方公告標準答案：A。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":17},{"id":20117,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第18題】某電商平台工程師需在已排序的價格清單中，快速定位指定價格是否存在，給定 排序後陣列：arr = [3, 8, 14, 19, 21, 27, 33, 45, 52]。若搜尋目標值為27，且採用標 準二分搜尋（Binary Search）流程（每次比較後排除中位數），請問最多需要比較 幾次即可找到目標？","options":["2 次","3 次","4 次","5 次"],"answer":1,"explanation":"官方公告標準答案：B。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":18},{"id":20118,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第19題】某物流公司導入強化式學習（Reinforcement Learning）優化車隊調度。模型在系 統運行過程中，會依據不同配送狀態動態調整行動選擇方式，使決策結果逐步朝 較佳績效收斂。上述模型在學習過程中的調整行為，最符合下列哪一項強化式學 習核心機制？","options":["調整策略函數以改變行動選擇機率","更新訓練資料分布以降低模型偏差","重新分群狀態資料以識別決策類型","建立正確決策標籤進行誤差修正"],"answer":0,"explanation":"官方公告標準答案：A。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":19},{"id":20119,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第20題】某團隊訓練影像分類模型，發現模型在訓練資料上的準確率達98%，但在測試資 料上僅有72%。若團隊希望提升模型對新資料的適應能力，並增加訓練資料的多 樣性，下列何者最適合？","options":["增加模型的深度與參數量，使模型學習更多細節","對訓練影像進行旋轉、翻轉等隨機變化","提高訓練速度，使模型更快完成學習","僅保留模型表現較好的訓練資料"],"answer":1,"explanation":"官方公告標準答案：B。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":20},{"id":20120,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第21題】某時尚品牌導入生成式AI（Generative AI）技術，建立服裝設計輔助系統。系統 需根據設計師輸入的風格條件，自動產生具有高度視覺品質、細節穩定且風格變 化自然的服裝草圖。團隊特別重視生成結果的穩定性與多樣性控制能力。在此需 求下，下列哪一種模型技術或方法較為適合？","options":["支援向量機（Support Vector Machine, SVM）","生成對抗網路（Generative Adversarial Network, GAN）","決策樹（Decision Tree）","擴散模型（Diffusion Model）"],"answer":3,"explanation":"官方公告標準答案：D。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":21},{"id":20121,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第22題】某製造業工廠規劃導入AI 監控系統，持續分析設備感測數據（如溫度、震動與壓 力）。系統需能在缺乏完整異常標註資料的情況下，辨識與一般運作型態顯著不同 的狀態，並發出預警。在此需求下，下列何種技術較為適合？","options":["使用支援向量機（Support Vector Machine, SVM）建立異常分類模型","以決策樹（Decision Tree）學習異常類型的判斷規則","採用變分自編碼器（Variational Autoencoder, VAE）學習正常資料分佈","使用生成對抗網路（Generative Adversarial Network, GAN）直接預測異常標籤"],"answer":2,"explanation":"官方公告標準答案：C。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":22},{"id":20122,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第23題】在AI 推論服務架構設計中，「批次推論（Batch Inference）」與「即時推論（Real- time Inference）」常依任務特性選擇不同機制。下列關於兩者特性的敘述何者最正 確？","options":["批次推論通常以同步請求方式回傳結果，以確保資料一致性；即時推論則多採 非同步機制以提升系統吞吐量（Throughput）","批次推論多用於延遲容忍度較高的大規模資料處理，通常以吞吐量 （Throughput）最佳化為優先；即時推論則著重於請求回應時間的穩定性與低延遲 特性","批次推論因計算資源需求高，僅適用於影像類模型；即時推論則主要應用於結 構化資料模型","即時推論為確保回應速度，通常限制為單筆資料輸入；批次推論則可支援同步 多筆資料即時回傳"],"answer":1,"explanation":"官方公告標準答案：B。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":23},{"id":20123,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第24題】某企業導入大型語言模型作為客服助理。模型已具備穩定語言能力，但在回覆偏 好一致性與組織規範遵循方面仍需優化，團隊因此規劃導入人類反饋強化學習 （RLHF）流程，下列何者最不屬於RLHF 階段的典型技術活動？","options":["透過人工評估方式建立偏好資料，使模型的不同候選輸出可反映人類主觀品質 差異","訓練一個能依據人類偏好判斷輸出品質的模型，作為模型優化過程中的回饋依 據","依據品質評估結果，調整模型生成策略，使其輸出更符合偏好導向的行為表 現","以未標註語料為主進行長週期表示學習訓練，以提升模型基礎語言建模能力"],"answer":3,"explanation":"官方公告標準答案：D。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":24},{"id":20124,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第25題】在大型語言模型（LLM）的推論服務中，常透過請求批次處理（Batching）來提升 系統效能。關於批次處理（Batching）機制的影響，下列敘述何者最正確？","options":["Batching 可提升加速器資源使用效率並增加整體吞吐量（Throughput），但在部 分情境下可能對單筆請求延遲造成影響","Batching 主要用於加快單筆請求回應時間","Batching 的效益主要來自降低記憶體使用量，對於吞吐量（Throughput）與延 遲表現影響有限","Batching 在低併發（Concurrency）請求下，仍能明顯提升系統效能"],"answer":0,"explanation":"官方公告標準答案：A。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":25},{"id":20125,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第26題】在可解釋AI(Explainable AI, XAI) 的分類架構中，LIME（Local Interpretable Model-agnostic Explanations）屬於哪一類解釋技術？","options":["內建可解釋模型（Intrinsic Interpretability）：模型本身具有透明的決策結構","對話式解釋系統（Conversational AI Explainer）：透過互動對話提供模型解釋","後處理模型解釋（post-hoc）：對已訓練模型提供外部解釋 ","代理模型技術（Surrogate Model）：訓練另一個簡單模型來完全取代原黑盒模型 進行推論"],"answer":2,"explanation":"官方公告標準答案：C。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":26},{"id":20126,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第27題】SHAP（SHapley Additive exPlanations）值常用於分析機器學習模型的輸出行為。 下列何者最符合SHAP 值所提供的資訊？","options":["模型在訓練過程中，各特徵對損失函數收斂速度的影響程度","依據特徵對模型整體準確率的影響，自動篩除低重要性變數","在單一預測結果中，各輸入特徵對最終輸出所產生的貢獻分配","透過調整特徵權重，使模型在推論階段降低計算複雜度"],"answer":2,"explanation":"官方公告標準答案：C。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":27},{"id":20127,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第28題】在金融業導入AI 模型與可解釋性技術時，反事實解釋（Counterfactual Explanation）最符合下列哪一種應用？","options":["分析整體客戶群的信用風險分布，以預測未來違約率趨勢","回溯歷史呆帳案例，辨識造成違約的主要影響因素","分析在模型不變的前提下，客戶申請資料變動對授信決策結果的影響","依據客戶輪廓與行為資料，推薦最適合的金融商品以提升交叉銷售"],"answer":2,"explanation":"官方公告標準答案：C。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":28},{"id":20128,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第29題】在深度學習模型的分析與驗證過程中，研究人員有時會利用「顯著性圖（Saliency Map）」來輔助理解模型行為。下列何者最符合此技術的主要用途？","options":["量化各輸入特徵對模型整體預測準確度的平均影響程度","標示輸入資料中對單一預測結果影響較大的區域或部分","評估在不同模型參數設定下，預測結果的穩定性變化","比較不同模型架構在測試資料上的泛化能力差異"],"answer":1,"explanation":"官方公告標準答案：B。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":29},{"id":20129,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第30題】某商業銀行想建立洗錢行為檢測系統，擁有過去5 年的交易記錄，其中包含已確 認的洗錢案例（標記為「異常」）和正常交易（標記為「正常」）。銀行希望系統能 自動識別新交易是否為洗錢行為，請問使用下列哪一種機器學習方法最為適合？","options":["監督式學習的分類問題","非監督式學習的分群問題","強化式學習","非監督式學習的關聯規則挖掘"],"answer":0,"explanation":"官方公告標準答案：A。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":30},{"id":20130,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第31題】某農場收集了大量作物葉片影像，但只有30%的影像有病害類別標註，其餘70% 的影像沒有任何標籤。農場希望充分利用所有資料來訓練病害識別模型。這種情 況最適合使用哪一種學習方法？","options":["半監督式學習（Semi-supervised Learning）","監督式學習（Supervised Learning）","非監督式學習（Unsupervised Learning）","強化式學習（Reinforcement Learning）"],"answer":0,"explanation":"官方公告標準答案：A。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":31},{"id":20131,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第32題】某環保局想建立AI 系統監測空氣品質，透過分析監測站攝影機拍攝的影像來識別 煙霧。系統需要在影像中找出煙霧區域並標示其位置和範圍。這個應用主要屬於 電腦視覺的哪個技術領域？","options":["影像分類，判斷影像中是否有煙霧","物件偵測，找出煙霧位置並用方框標示","影像分割，精確標示出煙霧的像素區域","人臉辨識，識別煙霧來源"],"answer":2,"explanation":"官方公告標準答案：C。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":32},{"id":20132,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第33題】某公車系統想預測各站點的到站時間，需要考慮歷史班次資料、即時路況、天氣 等因素。由於路況變化複雜，傳統循環神經網路（Recurrent Neural Network, RNN）在建模時可能難以保留較早期的重要資訊。下列哪種架構最能解決這個問 題？","options":["卷積神經網路（Convolutional Neural Network, CNN），利用卷積層捕捉局部特 徵","自編碼器（Autoencoder, AE），先進行資料壓縮再重建","全連接神經網路（Fully Connected Neural Network, FCNN），增加隱藏層數量","長短期記憶網路（Long Short-Term Memory, LSTM），改善RNN 的長期記憶問 題"],"answer":3,"explanation":"官方公告標準答案：D。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":33},{"id":20133,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第34題】某保險公司每月處理約50 萬筆理賠申請，希望建立AI 系統自動識別可疑的詐欺 案件。由於公司內部缺乏AI 專業人員，且需要快速上線驗證效果，IT 資訊主管正 在評估不同的AI 平台解決方案。在去識別化個人隱私資料後，下列哪一種平台類 型最適合該公司的需求？","options":["從零開始建立深度學習框架並自行訓練模型","採用開源機器學習框架進行客製化模型開發","使用雲端AutoML 平台進行自動化模型訓練","購買現成的詐欺偵測軟體套件直接部署"],"answer":2,"explanation":"官方公告標準答案：C。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":34},{"id":20134,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第35題】某市政府規劃釋出市民用電資料供學術研究使用，資料內容包含用電紀錄與部分 人口統計欄位。考量資料可能涉及可識別個人之資訊，且須符合個人資料保護相 關規範，下列哪一種資料處理方式最為適當？","options":["提供完整資料集並透過合約約定研究用途與保密責任","僅保留用電數值資料，移除所有其他欄位以避免識別風險","對具識別風險的資料欄位進行轉換處理，並移除直接識別資訊","僅將資料加密後提供，確保資料在傳輸過程中的安全性"],"answer":2,"explanation":"官方公告標準答案：C。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":35},{"id":20135,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第36題】某電子製造公司建置AI 視覺檢測系統，用於辨識PCB 電路板製程缺陷。系統在 影像判讀任務上表現穩定，但其模型設計與訓練目標皆侷限於特定應用範圍，無 法直接遷移至其他營運決策任務。依人工智慧能力範疇分類，下列何者最符合該 系統特性？","options":["弱AI（Weak AI/Narrow AI）","強AI（Strong AI）","通用人工智慧（Artificial General Intelligence, AGI）","超級人工智慧（Artificial Superintelligence, ASI）"],"answer":0,"explanation":"官方公告標準答案：A。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":36},{"id":20136,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第37題】某紡織製造公司導入AI 系統進行布料瑕疵檢測，每天需處理來自30 條產線的影 像資料，包括高解析度照片、感測器數值、生產參數記錄等多種格式。該公司收 集的資料量從每日2GB 增長至50GB，且需在布料離開產線前的3 秒內完成瑕疵 判定。近期團隊發現系統在尖峰時段容易出現判定延遲，影響製程節奏。若要優 先改善此問題，下列哪一種做法最適合？","options":["擴充資料儲存容量，以因應長期資料累積需求","強化即時資料處理與推論計算資源配置，以降低延遲風險","調整資料格式標準，以降低跨來源整合複雜度","增加資料驗證與清理機制，以提升資料品質穩定性"],"answer":1,"explanation":"官方公告標準答案：B。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":37},{"id":20137,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第38題】某果園管理公司計畫導入AI 系統協助農民判斷蘋果成熟度，透過分析果實特徵資 訊，評估成熟狀態並自動判斷採收時機。根據AI 應用領域的分類，這個系統主要 屬於哪一個應用領域？","options":["自然語言處理（Natural Language Processing）","電腦視覺（Computer Vision）","語音識別（Speech Recognition）","推薦系統（Recommendation System）"],"answer":1,"explanation":"官方公告標準答案：B。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":38},{"id":20138,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第39題】某企業評估於不同業務場景導入機器學習技術。下列哪一項應用情境與機器學習 類型的搭配最為適當？","options":["在醫療影像分析中，同時運用少量已標註資料與大量未標註影像進行模型訓練 —監督式學習（Supervised Learning）","在智慧推薦系統中，利用顧客是否點擊的歷史標籤資料預測未來偏好—非監督 式學習（Unsupervised Learning）","在詐欺交易分析中，模型透過錯誤判斷所產生的損失作為回饋訊號，持續調整 策略—監督式學習（Supervised Learning）","在股價資料分析中，將歷史價格變動模式劃分為若干趨勢型態，且未使用人工 標註—非監督式學習（Unsupervised Learning）"],"answer":3,"explanation":"官方公告標準答案：D。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":39},{"id":20139,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第40題】某製造業公司建置機器學習模型，用於預測產品是否為瑕疵品。實際生產資料 中，瑕疵品比例極低，大多數樣本皆為正常品。模型測試時發現，即使模型多數 預測為正常品，仍可獲得很高的整體準確率。在此情境下，若希望更有效衡量模 型對瑕疵品的辨識能力，下列何者較適合作為主要評估指標？","options":["F1-score","均方誤差（Root Mean Squared Error, RMSE）","準確率（Accuracy）","判定係數（R², Coefficient of Determination）"],"answer":0,"explanation":"官方公告標準答案：A。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":40},{"id":20140,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第41題】在大型語言模型（LLM）的效能優化中，Flash Attention 常被用來改善Transformer 注意力機制的運算效率。關於Flash Attention 的主要效益，下列敘述何者最正確？","options":["透過忽略影響較小的注意力權重，減少模型需要計算的關聯數量，以降低運算 成本","透過調整注意力計算與資料處理方式，減少中間結果的儲存需求，進而改善速 度與資源使用效率","透過增加注意力計算的並行程度，使模型可同時處理更多注意力頭部","透過將注意力結果暫存於高速快取記憶體，以避免重複計算造成延遲"],"answer":1,"explanation":"官方公告標準答案：B。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":41},{"id":20141,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第42題】某企業建置基於檢索增強生成（RAG）的法遵知識輔助系統，用於整合法規條 文、內控制度與歷史函釋文件。系統運行後發現，每當法規更新或新增解釋文件 時，需重新建立完整索引，導致更新期間系統暫停服務，且部分回應偶有引用舊 版內容的情形。若希望在兼顧查詢效率的同時提升知識更新彈性與系統穩定性， 下列何者最適合？","options":["提升模型推論資源配置，以維持高流量查詢時的回應效能","調整語言模型的輸出限制機制，以降低生成內容與法規不一致的風險","建立固定法規問答對照表，以規則化方式優先回應常見問題","導入可支援增量更新的索引管理方式，使異動文件可即時反映於檢索結果"],"answer":3,"explanation":"官方公告標準答案：D。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":42},{"id":20142,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第43題】關於機器學習不同的學習模式，下列敘述何者錯誤？ 1. 監督式學習（Supervised Learning）透過已標註資料學習輸入與目標之間的對應 關係，常見任務包含分類與數值預測。 2. 非監督式學習（Unsupervised Learning）雖不需標註資料，但通常需預先定義每 筆資料的正確輸出類別以利模型收斂。 3. 半監督式學習（Semi-supervised Learning）在訓練過程中僅利用未標註資料進行 特徵學習，並不涉及標註資料。 4. 自監督式學習（Self-supervised Learning）的訓練方式與監督式學習相同，皆需 人工逐筆提供標註資料。 5. 強化式學習（Reinforcement Learning）透過與環境互動並依據回饋訊號調整策 略，以優化決策行為。 6. 自監督式學習（Self-supervised Learning）通常利用資料本身產生訓練目標，以 降低對人工標註資料的依賴。","options":["2、3、6","2、4、5","1、3、6","2、3、4"],"answer":3,"explanation":"官方公告標準答案：D。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":43},{"id":20143,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第44題】某零售業者建立顧客行為預測模型，資料集中包含「年消費金額」、「平均單筆交 易金額」及「會員年資」等數值型特徵。資料分析顯示，部分金額特徵呈現高度 偏態分布，少數樣本的數值顯著高於多數觀測值。為降低極端值對模型學習穩定 性的影響，下列哪一種特徵工程方法最適合？","options":["對數轉換（Log Transformation）","區間化（Binning）","One-hot 編碼（One-hot Encoding）","隨機重抽樣（Random Resampling）"],"answer":0,"explanation":"官方公告標準答案：A。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":44},{"id":20144,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第45題】某團隊訓練深層神經網路模型時，發現訓練誤差長時間幾乎未下降，模型參數更 新幅度極小，呈現學習停滯現象。若研判問題與梯度傳遞效率有關，下列何者最 適合的改善策略？","options":["延長模型訓練時間，使模型有更多機會調整參數","增加訓練樣本數量，以提升模型學習能力","調整模型中的啟動函數設定，以改善訓練過程的穩定性","簡化模型結構，以降低模型過度擬合的可能性"],"answer":2,"explanation":"官方公告標準答案：C。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":45},{"id":20145,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第46題】某市政府建置城市治理資料平台，需整合交通車流偵測資料、路口監視器影像， 以及民眾透過陳情系統提交的文字通報。由於各類資料格式、儲存方式與資料型 態差異甚大，導致資料清理與整合成本顯著增加。就大數據特性而言，此專案最 主要面臨下列哪一項挑戰？","options":["Volume","Velocity","Variety","Veracity"],"answer":2,"explanation":"官方公告標準答案：C。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":46},{"id":20146,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第47題】某企業規劃導入AI 技術支援多項資料分析任務中，下列何種屬於結構化預測 （Structured Prediction）問題？","options":["判斷一封電子郵件是否為垃圾郵件","預測未來一週的產品需求量","預測客戶是否可能流失","為語音內容轉換後的文字進行逐詞標註"],"answer":3,"explanation":"官方公告標準答案：D。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":47},{"id":20147,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第48題】某物流公司想導入AI 以提升營運效率，評估不同資料型態與模型架構。下列哪一 種應用情境最適合採用卷積神經網路（Convolutional Neural Network, CNN）作為 主要模型架構？","options":["依據包裹每日掃描紀錄的時間序列，預測下週各倉庫的進貨量波動","根據客服對話逐句內容的先後順序，判斷客訴是否可能升級為申訴案件","根據倉庫監視器影像，自動辨識貨架是否缺貨並標示缺貨區域位置","依據車隊GPS 路徑點的連續軌跡，預測下一段可能行駛路線"],"answer":2,"explanation":"官方公告標準答案：C。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":48},{"id":20148,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第49題】某AI 科技公司在工業缺陷檢測領域已有成熟的辨識產品經驗。現欲與新客戶合作 開發一項類似產品的表面瑕疵檢測系統，但因新產品量產不久，標註樣本極為稀 少且專家標註成本高昂。在不大幅增加標註預算的前提下，下列哪一種做法最能 利用該公司既有的技術優勢來提升模型表現？","options":["增加模型參數規模，使模型具備更強表達能力","透過資料增強（Data Augmentation）擴展影像變化，以提升模型穩定性","重新蒐集大量影像並進行完整人工標註","採用遷移學習（Transfer Learning），利用既有預訓練模型進行調整"],"answer":3,"explanation":"官方公告標準答案：D。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":49},{"id":20149,"category":"官方公告試題｜115年第一次","question":"【115年第一次・人工智慧基礎概論・第50題】某醫院使用機器學習模型篩檢癌症患者。模型預測結果會決定哪些病人需要進一 步檢查。院方非常重視盡量找出所有可能的癌症患者，即希望降低漏診（Missed Diagnosis）風險，即便這可能增加一些誤判。下列哪一個評估指標最能反映模型 找出癌症患者的能力？","options":["精準率（Precision）","召回率（Recall）","假陽性率（False Positive Rate）","ROC-AUC 曲線"],"answer":1,"explanation":"官方公告標準答案：B。來源：115年第一次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第一次","number":50},{"id":20150,"category":"官方公告試題｜115年第一次","question":"【115年第一次・生成式AI應用與規劃・第1題】某零售企業導入生成式AI 商品推薦系統。測試結果顯示，在購物行為、偏好設定 與價格區間相同的情況下，不同客戶族群收到的推薦商品類型仍出現明顯差異， 且差異方向不易以既有行銷策略解釋。若在模型架構與推論設定皆未調整情形 下，專案目標是優先降低可能的模型偏差風險，下列何者最合理？","options":["重新檢視訓練資料的樣本分布與代表性","限制推薦結果僅顯示高銷量商品","降低模型參數規模以簡化決策邏輯","提高推薦結果的隨機性以增加多樣性"],"answer":0,"explanation":"官方公告標準答案：A。來源：115年第一次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":1},{"id":20151,"category":"官方公告試題｜115年第一次","question":"【115年第一次・生成式AI應用與規劃・第2題】在進行大型語言模型 (LLM) 企業專屬知識的Fine-tuning 時，若內部GPU 運算資 源與記憶體嚴重受限，下列哪一種參數高效微調（PEFT, Parameter Efficient Fine- Tuning）技術最能在維持模型效能的前提下，顯著降低需更新的參數數量？","options":["知識蒸餾（Knowledge Distillation）","提示詞工程（Prompt Engineering）","梯度凍結（Gradient Freezing）","低秩適配（Low-Rank Adaptation）"],"answer":3,"explanation":"官方公告標準答案：D。來源：115年第一次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":2},{"id":20152," 全仰賴外部系統","平台透過自動化設定機制，可顯著降低治理與合規管理需求"],"answer":0,"explanation":"官方公告標準答案：A。來源：115年第一次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":7},{"id":20157,"category":"官方公告試題｜115年第一次","question":"【115年第一次・生成式AI應用與規劃・第8題】某製造企業規劃於設備端建置邊緣運算（Edge Computing）架構，並以No- Code/Low-Code 平台開發即時監控應用。測試顯示，系統在雲端環境執行順暢， 但部署至邊緣裝置後出現回應延遲與效能下降。依此情境判斷，下列何者最合理 解釋該現象？","options":["邊緣運算架構可降低系統對效能的需求","No-Code/Low-Code 平台僅能在雲端環境執行","雲端部署通常比邊緣部署更容易出現延遲","邊緣裝置通常受限於運算能力與可用資源"],"answer":3,"explanation":"官方公告標準答案：D。來源：115年第一次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":8},{"id":20158,"category":"官方公告試題｜115年第一次","question":"【115年第一次・生成式AI應用與規劃・第9題】某企業使用生成式AI 進行文字分類，初期僅根據既有業務資料設計少量樣本提示 （Few-shot Prompting）。當模型應用至新市場資料時，團隊發現分類結果明顯不穩 定，且原先提供的範例並未涵蓋新市場常見的表達方式。依此情境判斷，下列何 者最可能為主要原因？","options":["模型容易對單一範例產生過度記憶","少量範例難以涵蓋新情境的資料差異","Prompt 設計無法引導模型擷取共通特徵","模型推理能力不足以完成分類任務"],"answer":1,"explanation":"官方公告標準答案：B。來源：115年第一次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":9},{"id":20159,"category":"官方公告試題｜115年第一次","question":"【115年第一次・生成式AI應用與規劃・第10題】某企業建置檢索增強生成（Retrieval-augmented generation, RAG）系統支援內部知 識查詢。隨著使用量提升，團隊發現模型回覆品質穩定，但推論延遲與運算成本 逐漸增加。專案規劃在維持回覆品質前提下進行效能優化。在此情境下，若採用 知識蒸餾（Knowledge Distillation），下列敘述何者最為合理？","options":["將檢索資料轉換為結構化規則以取代模型","僅透過增加檢索文件數量改善效能","停用生成模型以避免延遲問題","使小型模型學習大型模型行為，以降低推論成本"],"answer":3,"explanation":"官方公告標準答案：D。來源：115年第一次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":10},{"id":20160,"category":"官方公告試題｜115年第一次","question":"【115年第一次・生成式AI應用與規劃・第11題】某零售企業規劃提升門市數據應用能力，目標包括：門市主管可自行調整分析畫 面與檢視指標呈現，以及由行銷部門建立銷售預測模型，以支援補貨與促銷規 劃。企業在選型時以工具的主要功能定位與典型用途作為評估依據。依此需求判 斷，下列哪一項AI 工具使用規劃最合理？","options":["以AutoML 作為分析介面調整平台，No-Code 平台用於模型訓練","以No-Code 平台支援分析與介面調整，AutoML 負責模型建立","僅導入No-Code 平台，同時滿足高階模型建立與分析需求","僅導入AutoML，以兼顧介面調整與模型訓練"],"answer":1,"explanation":"官方公告標準答案：B。來源：115年第一次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":11},{"id":20161,"category":"官方公告試題｜115年第一次","question":"【115年第一次・生成式AI應用與規劃・第12題】下列何者最能正確說明Model Context Protocol（MCP）與檢索增強生成 （Retrieval-Augmented Generation, RAG）在功能定位上的主要差異？","options":["MCP 主要用於降低模型訓練成本；RAG 主要用於提升推論速度","MCP 著重模型與外部工具或系統互動；RAG 著重補充模型知識來源","RAG 必須依賴向量資料庫；MCP 不需任何外部整合","RAG 屬標準化通訊協議；MCP 屬資料檢索技術"],"answer":1,"explanation":"官方公告標準答案：B。來源：115年第一次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":12},{"id":20162,"category":"官方公告試題｜115年第一次","question":"【115年第一次・生成式AI應用與規劃・第13題】某企業建置文件型知識查詢系統，將大量長篇內部文件轉換為可供生成式AI 使用 的知識來源。在測試過程中，團隊發現若直接以整份文件進行檢索，模型回覆常 包含無關內容，且引用段落不夠精準。團隊評估後，決定導入Chunking 機制的主 要目的為何？","options":["透過縮短輸入長度，加速模型推理流程","提升檢索結果的語意對齊程度，並降低長文件帶來的干擾","減少模型執行時的記憶體使用量，以提升系統穩定性","讓模型在生成回覆時具備更高的創意發揮空間"],"answer":1,"explanation":"官方公告標準答案：B。來源：115年第一次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":13},{"id":20163,"category":"官方公告試題｜115年第一次","question":"【115年第一次・生成式AI應用與規劃・第14題】某企業導入大型語言模型（LLM）分析內部報表，使用者經常提供 Excel 匯出的 表格資料（如銷售數據與統計表）。測試時發現，模型對原始表格解析效果不穩 定。為提升模型理解與回應品質，下列哪一種上下文工程（Context Engineering） 作法較為適當？","options":["將表格內容轉換為結構化JSON 或Markdown table","在維持原始表格呈現方式下，補充欄位與數據說明","將表格資料隨機切割後分段輸入","直接提供原始表格內容以保留完整資訊"],"answer":0,"explanation":"官方公告標準答案：A。來源：115年第一次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":14},{"id":20164,"category":"官方公告試題｜115年第一次","question":"【115年第一次・生成式AI應用與規劃・第15題】在生成式AI 應用設計中，情境感知代理（Context-aware Agent）的核心特性為 何？","options":["能依任務需求即時重新訓練模型參數以優化結果","僅依使用者當前輸入指令執行任務，不保留歷程資訊","具備跨模態處理能力，可同時理解文字與影像內容","能利用對話歷史、任務狀態調整行為與決策"],"answer":3,"explanation":"官方公告標準答案：D。來源：115年第一次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":15},{"id":20165,"category":"官方公告試題｜115年第一次","question":"【115年第一次・生成式AI應用與規劃・第16題】某企業建置Agentic AI 系統處理跨部門複雜任務，團隊以解決方案圖譜（Solution Graph）作為規劃框架。下列何者為Solution Graph 的主要功能？","options":["取代語言模型推理機制，改以圖形搜尋完成決策","作為任務知識庫，用於儲存AI 已完成案例以 ":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":29},{"id":20179,"category":"官方公告試題｜115年第一次","question":"【115年第一次・生成式AI應用與規劃・第30題】某市政府環保局想建立一個垃圾分類查詢系統，讓民眾輸入物品名稱後自動判斷 分類。由於垃圾種類繁多，但每種分類的訓練範例有限，工程師決定採用少樣本 學習（Few-shot Learning）技術。下列何者為少樣本學習（Few-shot Learning）的 主要特徵？","options":["需重新蒐集大規模標註資料，以確保模型具備穩定表現","透過少量任務示例，引導模型適應新情境或新分類需求","不需任何範例輸入，即可完成新任務推論","僅適用於自然語言處理任務，對其他模態效果有限"],"answer":1,"explanation":"官方公告標準答案：B。來源：115年第一次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":30},{"id":20180,"category":"官方公告試題｜115年第一次","question":"【115年第一次・生成式AI應用與規劃・第31題】某有機農場累積了十年的病蟲害防治紀錄文件，包含不同作物的病害症狀描述、 防治方法和效果評估。農場主人希望建立一個AI 助手，能根據農民描述的作物症 狀，快速提供相關的防治建議和歷史案例。下列哪一種技術最適合解決這個需 求？","options":["直接使用ChatGPT 的預訓練知識回答農業問題","將所有文件內容加入ChatGPT 的系統提示詞中","採用RAG 技術，將農場文件建立向量資料庫，結合大語言模型生成回答","使用少樣本學習（Few-shot Learning），在提示詞中提供3-5 個病害案例"],"answer":2,"explanation":"官方公告標準答案：C。來源：115年第一次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":31},{"id":20181,"category":"官方公告試題｜115年第一次","question":"【115年第一次・生成式AI應用與規劃・第32題】隨著企業加速導入AI，No-Code/Low-Code 平台逐漸成為模型開發與產品化的常 見工具。相較於傳統自行撰寫程式的建模流程，下列何者最能正確描述此類平台 在模型訓練機制上的典型特性？","options":["透過視覺化介面與標準化流程，協助完成模型訓練與調校","主要提供既有模型推論能力，通常不支援重新訓練","著重資料處理與轉換，模型訓練仍需外部工具完成","多數僅適用於特定大數據框架（如Spark）的訓練流程"],"answer":0,"explanation":"官方公告標準答案：A。來源：115年第一次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":32},{"id":20182,"category":"官方公告試題｜115年第一次","question":"【115年第一次・生成式AI應用與規劃・第33題】某醫療院所希望改善行政效率，規劃讓各科室人員可自行建立行政回報與內部申 請表單，並導入AI 功能以自動判讀與分類填寫內容（如問題類型或需求性質）， 同時需兼顧流程調整彈性與降低系統開發維運負擔。下列哪一種技術組合最適 合？","options":["Low-Code 平台 × 預訓練語言模型 API","No-Code 平台 × 規則式自動化（Rule-based Automation）","傳統程式開發 × 自建深度學習模型","試算表工具 × 手動資料標記分析"],"answer":0,"explanation":"官方公告標準答案：A。來源：115年第一次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":33},{"id":20183,"category":"官方公告試題｜115年第一次","question":"【115年第一次・生成式AI應用與規劃・第34題】某企業導入 No-Code/Low-Code 平台開放各部門自行開發應用。半年後發現：出 現多個功能相近系統、資料欄位定義不一致，且部分應用未經審核即上線，並伴 隨權限與維運管理混亂。下列何者最可能為根本問題？","options":["缺乏統一的開發與上線管理機制","平台提供過高的應用設計自主性","部門未建立共用的資料分析呈現標準","系統整合與自動化能力尚未完善"],"answer":0,"explanation":"官方公告標準答案：A。來源：115年第一次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":34},{"id":20184,"category":"官方公告試題｜115年第一次","question":"【115年第一次・生成式AI應用與規劃・第35題】在生成式AI 文字生成模型設計中，Encoder–Decoder 與Decoder-only 為常見架 構。下列何者最能正確說明兩者在資訊處理與生成機制上的核心差異？","options":["Encoder–Decoder 透過編碼與解碼階段處理序列，Decoder-only 則以單一模型完 成處理","Encoder–Decoder 區分輸入理解與內容生成階段，Decoder-only 以單一模型同時 處理上下文與生成","Decoder-only 架構主要依賴外部知識檢索，Encoder–Decoder 則不需要","Encoder–Decoder 架構僅適用於翻譯任務，Decoder-only 架構較適合對話任務"],"answer":1,"explanation":"官方公告標準答案：B。來源：115年第一次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":35},{"id":20185,"category":"官方公告試題｜115年第一次","question":"【115年第一次・生成式AI應用與規劃・第36題】某連鎖零售企業使用生成式AI 協助規劃門市補貨策略。決策時需同時考量多項彼 此相關的因素，例如：庫存水位、促銷活動、區域銷售差異與物流限制。專案團 隊發現，AI 雖能逐步說明推論過程，但對於多條件之間的相互影響掌握不足，導 致建議結果偶有偏差。若希望透過提示工程（Prompt Engineering）改善此問題， 下列哪一種策略最為適合？","options":["Chain of Thought，要求模型逐步展開推論","Tree of Thoughts，增加多種推論路徑探索","Graph Prompting，以結構化方式呈現條件與關聯","Zero-shot Prompting，避免範例影響模型判斷"],"answer":2,"explanation":"官方公告標準答案：C。來源：115年第一次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":36},{"id":20186,"category":"官方公告試題｜115年第一次","question":"【115年第一次・生成式AI應用與規劃・第37題】某電商平台導入生成式AI 客服助理，用於自動回覆顧客詢問。營運需求包含：需 即時反映每日更新的促銷活動與商品資訊，同時維持品牌一致的回覆語氣，且企 業希望避免因模型重新訓練所造成的成本增加與系統不穩定。在此情境下，下列 哪一種技術策略最合理？","options":["僅進行Fine-tuning，使模型同時學習品牌語氣與即時促銷內容","僅導入RAG 更新促銷資訊，期望模型直接從檢索內容學習品牌語氣","透過Prompt Engineering 控制回覆風格，並以RAG 引入最新商品與活動資訊","持續進行增量Fine-tuning，以確保活動資訊同步更新"],"answer":2,"explanation":"官方公告標準答案：C。來源：115年第一次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":37},{"id":20187,"category":"官方公告試題｜115年第一次","question":"【115年第一次・生成式AI應用與規劃・第38題】某企業規劃導入生成式AI 助理，在正式全面部署前進行概念驗證（PoC），下列 何者最不適合作為此階段的主要工作？","options":["驗證模型在實際使用情境下的回覆品質與穩定性","測試AI 功能與業務需求的匹配程度","制定跨部門使用規範，與長期治理框架","評估系統整合可行性與技術限制"],"answer":2,"explanation":"官方公告標準答案：C。來源：115年第一次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":38},{"id":20188,"category":"官方公告試題｜115年第一次","question":"【115年第一次・生成式AI應用與規劃・第39題】某企業規劃導入生成式 AI 客服系統，需處理顧客查詢並引用歷史交易資料。法 遵部門在風險評估中指出，系統若不當處理顧客個人資料，可能引發合規與法律 責任。若專案初期希望從資料層面降低敏感資訊暴露風險，下列敘述何者最為合 理？","options":["強化模型輸出審查與遮罩機制，以過濾可能出現的敏感資訊","設定AI 回覆範圍與角色權限，限制其存取特定類型資料","將資料集中於加密儲存環境，並加強系統存取控管","僅提供必要資料或數據欄位與去識別化策略，減少模型接觸可識別個資"],"answer":3,"explanation":"官方公告標準答案：D。來源：115年第一次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":39},{"id":20189,"category":"官方公告試題｜115年第一次","question":"【115年第一次・生成式AI應用與規劃・第40題】某企業導入大型語言模型（LLM）進行客服自動化，並已透過Fine-Tuning 學習企 業標準問答範例，但在實務運作中仍出現回應策略未符合服務優先順序及語氣與 品牌風格不一致的情況，因此技術團隊建議再導入Reinforcement Fine-tuning （RFT）機制進行優化，其主要目的為何？","options":["擴展模型的知識涵蓋範圍與資料記憶能力","透過reward 訊號調整模型回應策略與行為偏好","提升模型推論速度與降低回應延遲","降低prompt 設計複雜度並取代訓練流程"],"answer":1,"explanation":"官方公告標準答案：B。來源：115年第一次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":40},{"id":20190,"category":"官方公告試題｜115年第一次","question":"【115年第一次・生成式AI應用與規劃・第41題】企業在評估AI 決策模型是否存在資料分布偏差時，下列何者最屬於偏見檢測 （Bias Detection）而非偏見緩解（Bias Mitigation）措施？","options":["比較不同資料分布的模型預測結果分布與錯誤率","重新加權訓練樣本以平衡資料分布代表性","在推論階段加入輸出過濾規則","調整模型決策閾值（Decision Threshold）以降低預測差異"],"answer":0,"explanation":"官方公告標準答案：A。來源：115年第一次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":41},{"id":20191,"category":"官方公告試題｜115年第一次","question":"【115年第一次・生成式AI應用與規劃・第42題】某企業希望利用含敏感資訊的資料進行AI 模型訓練，但政策要求原始資料不得外 洩，且資料可集中於安全環境中處理。同時，企業希望在資料使用過程中，即使 資料處於加密狀態，仍能完成模型計算。在此需求下，下列哪一種技術最為適 合？","options":["聯邦學習（Federated Learning）","同態加密（Homomorphic Encryption）","零知識證明（Zero-knowledge Proof）","資料匿名化（Data Anonymization）"],"answer":1,"explanation":"官方公告標準答案：B。來源：115年第一次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":42},{"id":20192,"category":"官方公告試題｜115年第一次","question":"【115年第一次・生成式AI應用與規劃・第43題】某金融服務公司規劃導入生成式AI，在評估模型部署方式時，基於內部控制與治 理要求，企業考慮將大型語言模型建置於公司可管理環境，而非直接採用外部雲 端服務。下列何者最能合理說明此部署決策的潛在優勢？","options":["有助提升模型回覆穩定性並降低隨機性影響","可降低敏感資料需傳輸至外部服務的風險","可直接減少模型訓練與維運所需資源投入","可避免模型輸出偏差與幻覺（Hallucination）問題"],"answer":1,"explanation":"官方公告標準答案：B。來源：115年第一次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":43},{"id":20193,"category":"官方公告試題｜115年第一次","question":"【115年第一次・生成式AI應用與規劃・第44題】某智慧製造廠導入語音互動AI 助理，作業人員可透過語音查詢設備狀態與操作指 引。系統流程包含語音轉文字、語言模型生成回覆，以及即時查詢內部系統資 料。測試結果顯示：語音轉文字在專業設備術語上錯誤率偏高；語言模型回覆偶 有內容不夠精準；系統整體回應速度略慢但仍在可接受範圍。若專案目標為優先 確保正確執行指令，下列改進措施的執行順序何者最合理？","options":["優化語言模型 → 強化語音模型 → 優化系統效能 → 調整生成參數","強化語音模型 → 優化語言模型與知識補充 → 調整生成參數 → 優化系統效 能","優化系統效能 → 強化語音模型 → 優化語言模型與知識補充 → 調整生成參 數","強化語音模型 → 優化系統效能 → 優化語言模型與知識補充 → 調整生成參 數"],"answer":1,"explanation":"官方公告標準答案：B。來源：115年第一次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":44},{"id":20194,"category":"官方公告試題｜115年第一次","question":"【115年第一次・生成式AI應用與規劃・第45題】某企業導入生成式AI 助理，協助內部人員撰寫專案建議與分析報告。團隊希望透 過思維鏈（Chain of Thought, CoT）提示設計提升模型輸出的邏輯性與推理透明 度，下列何者最符合該提示策略？","options":["「請直接給出最終建議，不需顯示分析過程。」","「以下提供兩份分析報告範例，請依相同格式產出新報告。」","「請將任務拆為三個步驟：資料整理 → 重點摘要 → 建議產出。」","「請逐步說明你的判斷依據與推理過程，最後再給出結論。」"],"answer":3,"explanation":"官方公告標準答案：D。來源：115年第一次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":45},{"id":20195,"category":"官方公告試題｜115年第一次","question":"【115年第一次・生成式AI應用與規劃・第46題】某金融監理機構規劃導入生成式AI 以協助內部人員分析申報文件與監理報告，系 統需處理大量涉及企業敏感資料與未公開資訊。主管機關明確要求「資料安全與 法規遵循必須優先於導入速度與成本考量」。在此條件下，下列哪一種策略最為適 當？","options":["採用雲端大型語言模型 API，並透過資料遮罩與加密機制降低外洩風險","導入開源模型進行私有化部署，以兼顧成本彈性與模型可控性","自行訓練並私有化部署模型，同時建立存取控管與稽核機制","先驗證模型效益，再逐步補強合規與資安架構"],"answer":2,"explanation":"官方公告標準答案：C。來源：115年第一次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":46},{"id":20196,"category":"官方公告試題｜115年第一次","question":"【115年第一次・生成式AI應用與規劃・第47題】某製造企業規劃導入生成式AI 協助產線異常紀錄分析，系統將根據設備回報與維 修紀錄自動產出問題摘要與建議處置說明。在試行測試階段，為降低營運與決策 風險，下列何者最應優先驗證？","options":["AI 生成建議與實際工程判斷的一致性與正確性","系統在高資料量輸入下的處理速度與延遲表現","模型對不同設備品牌資料格式的轉換能力","異常分析報告的視覺化呈現與介面易讀性"],"answer":0,"explanation":"官方公告標準答案：A。來源：115年第一次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":47},{"id":20197,"category":"官方公告試題｜115年第一次","question":"【115年第一次・生成式AI應用與規劃・第48題】某企業將機器學習模型部署於線上推薦系統。模型在測試階段表現良好，但上線 數月後，點擊率與預測準確度逐漸下降。經分析發現，近期使用者行為模式與模 型訓練期間的資料特徵出現顯著變化。此現象最可能屬於下列何者？","options":["模型過度擬合訓練資料，無法泛化至未知樣本","特徵工程設計不佳，導致輸入資訊不足","資料統計特徵隨時間改變，影響模型推論效果","系統資料結構調整，造成特徵欄位錯置"],"answer":2,"explanation":"官方公告標準答案：C。來源：115年第一次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":48},{"id":20198,"category":"官方公告試題｜115年第一次","question":"【115年第一次・生成式AI應用與規劃・第49題】某企業使用Low-Code 平台建置內部營運系統，系統需整合財務、庫存與第三方 物流服務。團隊希望確保系統在跨部門流程與外部服務整合下，具高可靠性與可 測試性。下列哪一項作法最能達成目標？","options":["只透過平台提供的流程模擬與即時預覽，檢查常用操作路徑","建立自動化測試流程，結合模擬外部服務與可重複執行的整合測試","將測試重點放在使用者介面操作，確認操作流程是否順暢","上線後再透過使用者回饋與報表監控系統行為，進行修正"],"answer":1,"explanation":"官方公告標準答案：B。來源：115年第一次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":49},{"id":20199,"category":"官方公告試題｜115年第一次","question":"【115年第一次・生成式AI應用與規劃・第50題】某招聘公司使用生成式AI 生成面試問題與候選人評估建議。團隊發現模型可能對 性別或年齡產生的資料分布偏差。下列哪一種策略最能有效降低生成偏差輸出的 風險？","options":["調整模型架構與參數，使生成更靈活與多樣化","大幅增加訓練資料量，但不清理或平衡資料中的性別與年齡分布","在生成後對模型輸出進行人工審查，並依偏差情況修正結果","僅允許高階主管操作系統，透過人員篩選控制生成結果"],"answer":2,"explanation":"官方公告標準答案：C。來源：115年第一次 生成式AI應用與規劃 公告試題。","difficulty":"官方試題","subject":"生成式AI應用與規劃","source":"115年第一次","number":50},{"id":20200,"category":"官方公告試題｜115年第三次","question":"【115年第三次・人工智慧基礎概論・第1題】某製造工廠計劃導入AI 預測產線設備的故障風險。維護團隊整理了過去五年的設 備運作資料，並由資深工程師逐一完成人工標註，將每筆資料標示為「正常運作」 或「發生故障」。若要利用這批已完成標註的歷史資料訓練分類模型，下列哪一種 機器學習方法最適合？","options":["監督式學習（Supervised Learning）","非監督式學習（Unsupervised Learning）","強化學習（Reinforcement Learning）","半監督式學習（Semi-supervised Learning）"],"answer":0,"explanation":"官方公告標準答案：A。來源：115年第三次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第三次","number":1},{"id":20201,"category":"官方公告試題｜115年第三次","question":"【115年第三次・人工智慧基礎概論・第2題】某電商平台希望利用AI 分析消費者行為。團隊取得過去會員交易資料，其中部分 資料已標註「是否流失會員」，另一部分資料僅包含會員瀏覽、購買及搜尋紀錄，但 未標註任何結果。下列何者最適合描述兩類資料的應用方式？","options":["已標註流失結果的資料適合用於監督式學習；未標註行為資料可用於非監督式 學習探索消費族群特徵","已標註流失結果的資料適合用於非監督式學習；未標註行為資料需先人工分類 才能進行監督式學習","兩類資料皆只能使用監督式學習，因企業應用皆需要明確預測結果","兩類資料皆屬生成式 AI 的訓練資料，因此無法用於機器學習模型"],"answer":0,"explanation":"官方公告標準答案：A。來源：115年第三次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第三次","number":2},{"id":20202,"category":"官方公告試題｜115年第三次","question":"【115年第三次・人工智慧基礎概論・第3題】某物流公司希望導入人工智慧（AI）技術，目標是能依據即時交通路況、配送車輛 位置及訂單需求，自動計算並決定最佳配送路線與車隊調度策略。下列何者最符合 此智慧物流應用所採用的AI 技術概念？","options":["利用光學字元辨識（OCR）技術，在收到新增的訂單時，自動辨識並擷取紙本單 據上的收件地址以完成系統建檔","利用文字探勘（Text Mining）技術，分析配送車輛位置的GPS 經緯度數字與即 時交通路況的車速資料，據此規劃最佳配送路線","運用生成式AI（Generative AI）技術，分析配送相關文件與服務紀錄，自動生成 營運分析報告與改善建議","利用機器學習與路徑優化演算法分析各項即時動態資料，由系統即時且持續優 化行車路線與配送調度"],"answer":3,"explanation":"官方公告標準答案：D。來源：115年第三次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第三次","number":3},{"id":20203,"category":"官方公告試題｜115年第三次","question":"【115年第三次・人工智慧基礎概論・第4題】某銀行導入AI 信用貸款評分系統上線半年後，風險稽核部門發現，即使模型訓練 資料中已不包含「職業別」欄位，仍可能透過「居住地區」與「消費類別」等高度 相關特徵，對特定職業族群產生不合理差異待遇。依據AI 治理精神，銀行應優先 採取下列何種行動？","options":["增設人工複核關卡，由授信人員針對系統所有的核貸結果重新逐案審查","提高「居住地區」與「消費類別」兩項特徵的資料準確度，以強化該模型整體的 預測效度","引入公平性評估指標，檢視間接關聯特徵是否造成偏誤並對模型進行調整優化","於核貸結果中另行加註該職業別標籤，以作為日後申請人提出申訴時的佐證依 據"],"answer":2,"explanation":"官方公告標準答案：C。來源：115年第三次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第三次","number":4},{"id":20204,"category":"官方公告試題｜115年第三次","question":"【115年第三次・人工智慧基礎概論・第5題】某新創公司開發三款針對特定任務設計的AI 產品，分別為：可自動生成社群貼文 的「智慧行銷助理」、透過人臉辨識進行身分驗證的「辦公室門禁系統」，以及預測 客戶流失風險的「資料分析模型」。上述產品依人工智慧的分類，皆屬於下列何者？","options":["超級人工智慧（ASI）","弱人工智慧（Weak AI）","通用人工智慧（AGI）","具身人工智慧（Embodied AI）"],"answer":1,"explanation":"官方公告標準答案：B。來源：115年第三次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第三次","number":5},{"id":20205,"category":"官方公告試題｜115年第三次","question":"【115年第三次・人工智慧基礎概論・第6題】某壽險公司AI 客服助理上線後進行測試。顧客與AI 助理對話時，全程未察覺對方 並非真人，回應自然且能適當安撫顧客情緒。然而，當顧客詢問「我同時符合兩項 理賠條件，應優先申請哪一項？」時，AI 助理前後提供不同建議；進一步詢問原因 時，也無法說明判斷依據，只能持續提供語意通順但未能回答問題的內容。技術主 管認為，既然AI 已具備足以讓人誤認為真人的對話能力，就代表其判斷結果值得 信賴。依據圖靈測試（Turing Test）的設計理念，下列何者最適合評估上述技術主 管的觀點？","options":["圖靈測試主要用於評估AI 是否具有可解釋性，因此無法說明判斷依據即代表未 通過圖靈測試","圖靈測試通過後，即可合理推論AI 在專業領域的判斷能力已達人類水準","圖靈測試的目的在驗證AI 是否能針對各類問題提供正確且一致的答案，因此回 答內容是否正確是主要評估重點","圖靈測試主要評估AI 是否能展現近似人類的對話表現，並不能據此推論其具備 可靠的專業判斷與決策能力"],"answer":3,"explanation":"官方公告標準答案：D。來源：115年第三次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第三次","number":6},{"id":20206,"category":"官方公告試題｜115年第三次","question":"【115年第三次・人工智慧基礎概論・第7題】根據數位發展部《公部門人工智慧應用參考手冊》，若AI 系統的自動決策可能對民 眾權益造成重大影響，最應優先確保下列哪一項機制？","options":["演算法模型應經第三方公正機構進行技術合規檢測","建立人在迴圈內（Human-in-the-loop）的最終審核機制","系統應定期進行弱點掃描與資安檢測，以降低系統遭受攻擊的風險","系統產製的所有決策及決策軌跡皆應全程公開於政府資訊網站"],"answer":1,"explanation":"官方公告標準答案：B。來源：115年第三次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第三次","number":7},{"id":20207,"category":"官方公告試題｜115年第三次","question":"【115年第三次・人工智慧基礎概論・第8題】某製造企業欲建置AI 品質檢測系統，利用生產線攝影機即時判斷零件表面是否存 在細微刮痕。下列何種技術最適合用於此類應用？","options":["強化學習（Reinforcement Learning），透過獎勵機制改善影像辨識結果","決策樹（Decision Tree），透過人工設定規則判斷影像像素差異","分群演算法（Clustering Algorithm），依資料距離將影像自動分類","卷積神經網路（CNN），透過學習影像中的局部特徵進行缺陷辨識"],"answer":3,"explanation":"官方公告標準答案：D。來源：115年第三次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第三次","number":8},{"id":20208,"category":"官方公告試題｜115年第三次","question":"【115年第三次・人工智慧基礎概論・第9題】某電商平台計劃開發一個機器學習模型，目標是在每個月底自動預測哪些現有會員 在下個月可能會流失（不再消費），以便行銷團隊提前發送優惠券進行挽留。若要 提升模型預測會員流失的效果，在進行特徵工程（Feature Engineering）時，下列哪 一項作法最適合？","options":["為了提高預測的準確度，特徵與要預測的目標值（是否流失）之間，在統計上不 需要具備任何關聯性或因果關係","可以將「會員下個月是否仍有消費紀錄」加入模型特徵，因為該資訊與會員是否 流失具有高度關聯性","為了縮短模型推理（Inference）的反應時間，特徵所涵蓋的時間範圍越短越好， 建議一律只保留前一天的單日行為資料","所選取的特徵，必須是在每個月底模型進行預測的當下，系統就能實際取得且掌 握的已知資料"],"answer":3,"explanation":"官方公告標準答案：D。來源：115年第三次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第三次","number":9},{"id":20209,"category":"官方公告試題｜115年第三次","question":"【115年第三次・人工智慧基礎概論・第10題】某零售電商平台計劃建置機器學習模型分析會員行為。在資料預處理階段，資料科 學團隊發現會員的「年消費總額」與「月到訪次數」數值範圍差異較大，可能影響 部分機器學習模型的訓練效果，因此決定採用Z-Score 標準化（Standardization） 進 行特徵縮放。已知該平台全體會員的「年消費總額」平均值為30,000 元，標準差為 5,000 元。若某位VIP 會員的年消費總額為40,000 元，下列敘述何者正確？","options":["經過Z-Score 轉換後，該會員的年消費總額特徵值將被限制於0 至1 的範圍內， 以利模型訓練","計算後該會員的Z-Score 值為2，代表其消費金額高於平均值兩個標準差，可反 映其消費金額相對於整體會員的高低程度","不論原始消費資料的分布為何，只要經過Z-Score 轉換，整組資料一定會轉換為 標準常態分配","即使完成Z-Score 轉換，由於「月到訪次數」與「年消費總額」原始計量單位不 同，兩項特徵仍不適合同時作為機器學習模型的輸入"],"answer":1,"explanation":"官方公告標準答案：B。來源：115年第三次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第三次","number":10},{"id":20210,"category":"官方公告試題｜115年第三次","question":"【115年第三次・人工智慧基礎概論・第11題】某健康管理AI 系統透過智慧手環蒐集使用者的生理量測資料，資料以欄位標籤 （Tag）記錄，例如「使用者ID：H123」、「量測項目：心率」、「量測數值：75」等。 不同裝置可依功能需求上傳不同欄位（如：血氧濃度），因此各筆資料不一定具有 完全相同的欄位結構。在資料格式與資料結構特徵的分類上，此類資料最屬於下列 哪一種資料型態？","options":["結構化資料（Structured Data）","半結構化資料（Semi-structured Data）","高頻資料（High-frequency Data）","時序資料（Time Series Data）"],"answer":1,"explanation":"官方公告標準答案：B。來源：115年第三次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第三次","number":11},{"id":20211,"category":"官方公告試題｜115年第三次","question":"【115年第三次・人工智慧基礎概論・第12題】某電商平台的客服部門統計了本月10,000 筆顧客服務評分（滿分100 分），發現平 均分數為72 分，中位數為85 分，平均數顯著小於中位數。資料分析師欲初步判斷 此評分資料的分配型態，下列敘述何者最合理？","options":["資料呈負偏態分配（左偏，Skewness to the Left），代表多數顧客給予高分，但少 數極低評分將平均數大幅拉低","資料呈正偏態分配（右偏，Skewness to the Right），代表多數顧客給予低分，但 少數極高評分將平均數大幅拉高","資料呈標準常態分配，平均數與中位數的些微差異屬於正常的隨機抽樣誤差","資料呈均勻分配，各分數區間出現的機率大致相同，因此平均數略低於中位數"],"answer":0,"explanation":"官方公告標準答案：A。來源：115年第三次 人工智慧基礎概論 公告試題。","difficulty":"官方試題","subject":"人工智慧基礎概論","source":"115年第三次","number":12},{"id":20212,"category":"官方公告試題｜115年第三次","question":"【115年第三次・人工智慧基礎概論・第13題】某電商平台的資料科學團隊欲建置一套NLP 模型，用於分析顧客在社群媒體上對 商品的評論情緒。在將原始貼文資料送入模型訓練前，團隊執行了以下步驟：移除 貼文中夾雜的HTML 標籤與網址、將表情符號轉換或移除、去除「的、了、啊」等 對情緒判斷無實質貢獻的
