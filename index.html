<head>

<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#18202c;--muted:#6b7280;--brand:#5b5bd6;--ok:#138a5b;--bad:#c43d4b;--line:#e5e7eb}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif}
.wrap{max-width:900px;margin:auto;padding:18px} header{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:clamp(22px,4vw,34px);margin:4px 0} .sub{color:var(--muted);font-size:14px}
.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 28px rgba(0,0,0,.05)}
.panel{padding:14px;margin:16px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{font-size:13px;color:var(--muted)} select,button{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:#fff;font:inherit}
button{cursor:pointer;font-weight:700} button.primary{background:var(--brand);color:#fff;border-color:var(--brand)} button.secondary{background:#eef0ff;color:#3636a8}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0} .pill{background:#fff;border:1px solid var(--line);padding:7px 10px;border-radius:999px;font-size:13px}
.progress{height:9px;background:#e9ebf3;border-radius:99px;overflow:hidden} .bar{height:100%;background:var(--brand);width:0}
.card{padding:22px;margin-top:14px} .meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px}
.q{font-size:clamp(20px,3vw,27px);line-height:1.45;margin:20px 0}
.option{display:block;width:100%;text-align:left;margin:10px 0;padding:14px 15px;border:1px solid var(--line);border-radius:13px;background:#fff}
.option:hover{border-color:#9b9be8} .option.selected{border-color:var(--brand);background:#f0f0ff}
.option.correct{border-color:var(--ok);background:#ecfbf4} .option.wrong{border-color:var(--bad);background:#fff0f1}
.result{display:none;margin-top:18px;padding:15px;border-radius:13px;line-height:1.65} .result.show{display:block}
.result.ok{background:#eaf9f2;color:#0c6743} .result.bad{background:#fff0f1;color:#9c2735}
.actions{display:grid;grid-template-columns:1fr;gap:10px;margin-top:18px}.actions button{font-size:18px;padding:15px}.actions button:disabled{cursor:not-allowed;opacity:.55}.actions button.good{background:var(--ok);color:#fff;border-color:var(--ok)}.actions button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.small{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.5}
@media(max-width:600px){.card{padding:16px}.option{padding:16px 14px;font-size:17px}.actions button{font-size:17px}}
</style>
</head>

<div class="wrap">
<header><div><h1>🧠 iPAS AI 應用規劃師</h1><div class="sub">1460 題｜分科練習、點選即判題、解析與錯題重練</div></div><button id="reset" style="width:auto">重設進度</button></header>
<div class="panel">
<div><label>練習模式</label><select id="mode"><option value="sequential">循序練習</option><option value="random">隨機抽題</option><option value="wrong">錯題重練</option></select></div>
<div><label>科目</label><select id="subject"><option value="全部">全部科目</option><option value="人工智慧基礎概論">人工智慧基礎概論</option><option value="生成式AI應用與規劃">生成式AI應用與規劃</option></select></div>
<div><label>題目分類</label><select id="category"><option value="全部">全部分類</option></select></div>
<div><label>難度</label><select id="difficulty"><option value="全部">全部難度</option><option value="基礎">基礎</option><option value="進階">進階</option></select></div>
<div><label>每輪題數</label><select id="limit"><option>10</option><option>20</option><option>50</option><option value="9999">全部</option></select></div>
<div style="align-self:end"><button class="secondary" id="start">開始新一輪</button></div>
</div>
<div class="stats">

</div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="card">
<div class="meta"><span id="catLabel">分類</span><span id="idLabel">題號</span></div>
<div class="q" id="question">按「開始新一輪」開始練習。</div>
<div id="options"></div>
<div id="result" class="result"></div>
<div class="actions"><button id="next" disabled>請先選擇答案</button></div>
</div>

<script>
const QUESTIONS=[{"id":1,"category":"AI基礎","question":"下列哪一個名詞最符合此描述：讓機器執行通常需要人類智慧的任務？","options":["人機協作","人工智慧（AI）","關鍵績效指標（KPI）","生成式AI"],"answer":1,"explanation":"人工智慧（AI）：讓機器執行通常需要人類智慧的任務。AI是上位概念，機器學習與深度學習是其子領域。","difficulty":"基礎","subject":"人工智慧基礎概論"},{"id":2,"category":"AI基礎","question":"關於「人工智慧（AI）」，下列何者最正確？","options":["序列訓練模型並逐步關注先前錯誤","讓機器執行通常需要人類智慧的任務","在模型定案後評估泛化能力的保留資料","沒有固定表格結構的文字、影像、音訊或影片"],"answer":1,"explanation":"正確定義是：讓機器執行通常需要人類智慧的任務。AI是上位概念，機器學習與深度學習是其子領域。","difficulty":"基礎","subject":"人工智慧基礎概論"},{"id":3,"category":"AI基礎","question":"情境：企業希望系統能辨識影像、理解文字並協助決策。此情境最直接對應哪一個概念？","options":["人工智慧（AI）","投資報酬率（ROI）","弱人工智慧","AI應用情境盤點"],"answer":0,"explanation":"此情境對應「人工智慧（AI）」。AI是上位概念，機器學習與深度學習是其子領域。","difficulty":"基礎","subject":"人工智慧基礎概論"},{"id":4,"category":"AI基礎","question":"下列關於「人工智慧（AI）」的敘述，何者正確？","options":["人工智慧（AI）只適用於完全沒有資料的情況","人工智慧（AI）的核心重點是：讓機器執行通常需要人類智慧的任務","人工智慧（AI）可保證模型永遠不會出錯","人工智慧（AI）的主要目的必然是增加硬體算力"],"answer":1,"explanation":"人工智慧（AI）的核心重點是：讓機器執行通常需要人類智慧的任務。AI是上位概念，機器學習與深度學習是其子領域。","difficulty":"基礎","subject":"人工智慧基礎概論"},{"id":5,"category":"AI基礎","question":"下列哪一個名詞最符合此描述：讓模型從資料中學習規律，而非逐條撰寫規則？","options":["機器學習（ML）","弱人工智慧","深度學習（DL）","AI應用情境盤點"],"answer":0,"explanation":"機器學習（ML）：讓模型從資料中學習規律，而非逐條撰寫規則。重點是從資料學得映射或結構。","difficulty":"基礎","subject":"人工智慧基礎概論"},{"id":6,"category":"AI基礎","question":"關於「機器學習（ML）」，下列何者最正確？","options":["保留誰在何時使用何資料、模型與決策的紀錄","讓模型從資料中學習規律，而非逐條撰寫規則","模型產生看似合理但事實錯誤或無根據內容","持續追蹤效能、延遲、錯誤、資料分布與公平性"],"answer":1,"explanation":"正確定義是：讓模型從資料中學習規律，而非逐條撰寫規則。重點是從資料學得映射或結構。","difficulty":"基礎","subject":"人工智慧基礎概論"},{"id":7,"category":"AI基礎","question":"情境：客服分類系統以歷史標註資料學習自動分類。此情境最直接對應哪一個概念？","options":["人機協作","機器學習（ML）","概念驗證（PoC）","判別式AI"],"answer":1,"explanation":"此情境對應「機器學習（ML）」。重點是從資料學得映射或結構。","difficulty":"基礎","subject":"人工智慧基礎概論"},{"id":8,"category":"AI基礎","question":"下列關於「機器學習（ML）」的敘述，何者正確？","options":["機器學習（ML）可保證模型永遠不會出錯","機器學習（ML）的核心重點是：讓模型從資料中學習規律，而非逐條撰寫規則","機器學習（ML）只適用於完全沒有資料的情況","機器學習（ML）的主要目的必然是增加硬體算力"],"answer": "difficulty":"進階","question":"關於「顯著性圖（Saliency Map）」，下列敘述何者最正確？","options":["可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況","標示輸入中對單一預測結果影響較大的區域或元素","主要用來提高硬體運算速度，與模型分析無關"],"answer":2,"explanation":"顯著性圖（Saliency Map）的重點是：標示輸入中對單一預測結果影響較大的區域或元素。用於單筆預測的局部解釋，常以輸入梯度或其變形呈現重要區域。","subject":"人工智慧基礎概論"},{"id":571,"category":"模型分析與驗證","difficulty":"進階","question":"情境：研究人員希望看CNN判定貓時主要關注影像哪一區，並保留空間位置資訊。最適合的技術或概念為何？","options":["Permutation Importance","Grad-CAM","PDP","LIME"],"answer":1,"explanation":"Grad-CAM：利用卷積層梯度產生類別相關的粗粒度熱區圖。Grad-CAM特別適合CNN影像模型，通常作用於最後卷積層。","subject":"人工智慧基礎概論"},{"id":572,"category":"模型分析與驗證","difficulty":"進階","question":"關於「Grad-CAM」，下列敘述何者最正確？","options":["利用卷積層梯度產生類別相關的粗粒度熱區圖","主要用來提高硬體運算速度，與模型分析無關","可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況"],"answer":0,"explanation":"Grad-CAM的重點是：利用卷積層梯度產生類別相關的粗粒度熱區圖。Grad-CAM特別適合CNN影像模型，通常作用於最後卷積層。","subject":"人工智慧基礎概論"},{"id":573,"category":"模型分析與驗證","difficulty":"進階","question":"情境：模型輸出對像素梯度接近零，但研究人員仍想估計特徵歸因。最適合的技術或概念為何？","options":["SHAP Kernel Explainer","PCA","Bootstrap","Integrated Gradients"],"answer":3,"explanation":"Integrated Gradients：由基準輸入到實際輸入沿路徑積分梯度，以降低梯度飽和造成的不穩定。Integrated Gradients需要選擇baseline，並滿足完整性等性質。","subject":"人工智慧基礎概論"},{"id":574,"category":"模型分析與驗證","difficulty":"進階","question":"關於「Integrated Gradients」，下列敘述何者最正確？","options":["可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況","由基準輸入到實際輸入沿路徑積分梯度，以降低梯度飽和造成的不穩定","主要用來提高硬體運算速度，與模型分析無關"],"answer":2,"explanation":"Integrated Gradients的重點是：由基準輸入到實際輸入沿路徑積分梯度，以降低梯度飽和造成的不穩定。Integrated Gradients需要選擇baseline，並滿足完整性等性質。","subject":"人工智慧基礎概論"},{"id":575,"category":"模型分析與驗證","difficulty":"進階","question":"情境：複雜黑箱模型對某位客戶拒貸，分析者想用附近擾動樣本近似此決策。最適合的技術或概念為何？","options":["模型蒸餾","LIME","全域線性回歸","ROC分析"],"answer":1,"explanation":"LIME：在單一樣本附近建立可解釋的局部代理模型。LIME是局部、模型無關的解釋方法，結果可能受擾動與取樣影響。","subject":"人工智慧基礎概論"},{"id":576,"category":"模型分析與驗證","difficulty":"進階","question":"關於「LIME」，下列敘述何者最正確？","options":["在單一樣本附近建立可解釋的局部代理模型","主要用來提高硬體運算速度，與模型分析無關","可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況"],"answer":0,"explanation":"LIME的重點是：在單一樣本附近建立可解釋的局部代理模型。LIME是局部、模型無關的解釋方法，結果可能受擾動與取樣影響。","subject":"人工智慧基礎概論"},{"id":577,"category":"模型分析與驗證","difficulty":"進階","question":"情境：分析者要解釋每個特徵如何推高或拉低單筆風險分數。最適合的技術或概念為何？","options":["K-Means","A/B測試","Early Stopping","SHAP"],"answer":3,"explanation":"SHAP：以Shapley value分配各特徵對預測相對基準值的貢獻。SHAP可做局部與整體解釋，但計算成本依方法而異。","subject":"人工智慧基礎概論"},{"id":578,"category":"模型分析與驗證","difficulty":"進階","question":"關於「SHAP」，下列敘述何者最正確？","options":["可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況","以Shapley value分配各特徵對預測相對基準值的貢獻","主要用來提高硬體運算速度，與模型分析無關"],"answer":2,"explanation":"SHAP的重點是：以Shapley value分配各特徵對預測相對基準值的貢獻。SHAP可做局部與整體解釋，但計算成本依方法而異。","subject":"人工智慧基礎概論"},{"id":579,"category":"模型分析與驗證","difficulty":"進階","question":"情境：團隊想評估某欄位對整體測試表現的重要程度，而非解釋單筆預測。最適合的技術或概念為何？","options":["Counterfactual Explanation","Permutation Importance","Saliency Map","Grad-CAM"],"answer":1,"explanation":"Permutation Importance：隨機打亂單一特徵後觀察模型效能下降幅度。它衡量全域重要性；高度相關特徵可能分散或低估重要度。","subject":"人工智慧基礎概論"},{"id":580,"category":"模型分析與驗證","difficulty":"進階","question":"關於「Permutation Importance」，下列敘述何者最正確？","options":["隨機打亂單一特徵後觀察模型效能下降幅度","主要用來提高硬體運算速度，與模型分析無關","可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況"],"answer":0,"explanation":"Permutation Importance的重點是：隨機打亂單一特徵後觀察模型效能下降幅度。它衡量全域重要性；高度相關特徵可能分散或低估重要度。","subject":"人工智慧基礎概論"},{"id":581,"category":"模型分析與驗證","difficulty":"進階","question":"情境：團隊想觀察收入提高時模型平均風險分數如何變化。最適合的技術或概念為何？","options":["Confusion Matrix","t-SNE","Data Lineage","Partial Dependence Plot（PDP）"],"answer":3,"explanation":"Partial Dependence Plot（PDP）：顯示平均而言某特徵變化對模型預測的邊際影響。PDP是全域解釋，若特徵高度相關，可能產生不切實際組合。","subject":"人工智慧基礎概論"},{"id":582,"category":"模型分析與驗證","difficulty":"進階","question":"關於「Partial Dependence Plot（PDP）」，下列敘述何者最正確？","options":["可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況","顯示平均而言某特徵變化對模型預測的邊際影響","主要用來提高硬體運算速度，與模型分析無關"],"answer":2,"explanation":"Partial Dependence Plot（PDP）的重點是：顯示平均而言某特徵變化對模型預測的邊際影響。PDP是全域解釋，若特徵高度相關，可能產生不切實際組合。","subject":"人工智慧基礎概論"},{"id":583,"category":"模型分析與驗證","difficulty":"進階","question":"情境：PDP平均效果掩蓋不同客群反應，團隊想看個別樣本曲線。最適合的技術或概念為何？","options":["Learning Curve","ICE Plot","ROC Curve","Calibration Curve"],"answer":1,"explanation":"ICE Plot：對每筆樣本分別繪出某特徵變化時的預測曲線。ICE可揭露樣本間異質性，PDP則是ICE的平均。","subject":"人工智慧基礎概論"},{"id":584,"category":"模型分析與驗證","difficulty":"進階","question":"關於「ICE Plot」，下列敘述何者最正確？","options":["對每筆樣本分別繪出某特徵變化時的預測曲線","主要用來提高硬體運算速度，與模型分析無關","可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況"],"answer":0,"explanation":"ICE Plot的重點是：對每筆樣本分別繪出某特徵變化時的預測曲線。ICE可揭露樣本間異質性，PDP則是ICE的平均。","subject":"人工智慧基礎概論"},{"id":585,"category":"模型分析與驗證","difficulty":"進階","question":"情境：申貸人想知道收入或負債比需改到何種程度才可能通過。最適合的技術或概念為何？","options":["特徵標準化","模型剪枝","資料增強","反事實解釋（Counterfactual Explanation）"],"answer":3,"explanation":"反事實解釋（Counterfactual Explanation）：找出最小且可行的輸入改變，使模型輸出轉為期望結果。反事實應兼顧可行性、稀疏性與不可變特徵限制。","subject":"人工智慧基礎概論"},{"id":586,"category":"模型分析與驗證","difficulty":"進階","question":"關於「反事實解釋（Counterfactual Explanation）」，下列敘述何者最正確？","options":["可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況","找出最小且可行的輸入改變，使模型輸出轉為期望結果","主要用來提高硬體運算速度，與模型分析無關"],"answer":2,"explanation":"反事實解釋（Counterfactual Explanation）的重點是：找出最小且可行的輸入改變，使模型輸出轉為期望結果。反事實應兼顧可行性、稀疏性與不可變特徵限制。","subject":"人工智慧基礎概論"},{"id":587,"category":"模型分析與驗證","difficulty":"進階","question":"情境：所有預測為0.8的案例中，實際約八成為正類。最適合的技術或概念為何？","options":["增加資料維度","校準（Calibration）","提高Accuracy","降低模型延遲"],"answer":1,"explanation":"校準（Calibration）：使模型預測機率與事件實際發生頻率一致。高AUC不代表機率已校準；可用可靠度圖、Brier score檢查。","subject":"人工智慧基礎概論"},{"id":588,"category":"模型分析與驗證","difficulty":"進階","question":"關於「校準（Calibration）」，下列敘述何者最正確？","options":["使模型預測機率與事件實際發生頻率一致","主要用來提高硬體運算速度，與模型分析無關","可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況"],"answer":0,"explanation":"校準（Calibration）的重點是：使模型預測機率與事件實際發生頻率一致。高AUC不代表機率已校準；可用可靠度圖、Brier score檢查。","subject":"人工智慧基礎概論"},{"id":589,"category":"模型分析與驗證","difficulty":"進階","question":"情境：團隊關心預測機率品質，而不只是分類是否正確。最適合的技術或概念為何？","options":["BLEU","Silhouette Score","MAPE","Brier Score"],"answer":3,"explanation":"Brier Score：衡量二元機率預測與實際結果間的均方誤差。Brier score越低通常越好，兼顧校準與辨識能力。","subject":"人工智慧基礎概論"},{"id":590,"category":"模型分析與驗證","difficulty":"進階","question":"關於「Brier Score」，下列敘述何者最正確？","options":["可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況","衡量二元機率預測與實際結果間的均方誤差","主要用來提高硬體運算速度，與模型分析無關"],"answer":2,"explanation":"Brier Score的重點是：衡量二元機率預測與實際結果間的均方誤差。Brier score越低通常越好，兼顧校準與辨識能力。","subject":"人工智慧基礎概論"},{"id":591,"category":"模型分析與驗證","difficulty":"進階","question":"情境：詐欺率只有0.1%，團隊希望比較模型在少數類別上的整體表現。最適合的技術或概念為何？","options":["Adjusted Rand Index","PR-AUC","R²","MSE"],"answer":1,"explanation":"PR-AUC：在正類稀少時評估Precision與Recall取捨的面積。類別極不平衡時，PR-AUC通常比ROC-AUC更具辨識力。","subject":"人工智慧基礎概論"},{"id":592,"category":"模型分析與驗證","difficulty":"進階","question":"關於「PR-AUC」，下列敘述何者最正確？","options":["在正類稀少時評估Precision與Recall取捨的面積","主要用來提高硬體運算速度，與模型分析無關","可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況"],"answer":0,"explanation":"PR-AUC的重點是：在正類稀少時評估Precision與Recall取捨的面積。類別極不平衡時，PR-AUC通常比ROC-AUC更具辨識力。","subject":"人工智慧基礎概論"},{"id":593,"category":"模型分析與驗證","difficulty":"進階","question":"情境：多類別資料不平衡，但每個類別都同等重要。最適合的技術或概念為何？","options":["Micro F1","Weighted F1","Accuracy","Macro F1"],"answer":3,"explanation":"Macro F1：先分別計算各類別F1再做等權平均。Macro F1不依類別樣本量加權，因此重視少數類別。","subject":"人工智慧基礎概論"},{"id":594,"category":"模型分析與驗證","difficulty":"進階","question":"關於「Macro F1」，下列敘述何者最正確？","options":["可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況","先分別計算各類別F1再做等權平均","主要用來提高硬體運算速度，與模型分析無關"],"answer":2,"explanation":"Macro F1的重點是：先分別計算各類別F1再做等權平均。Macro F1不依類別樣本量加權，因此重視少數類別。","subject":"人工智慧基礎概論"},{"id":595,"category":"模型分析與驗證","difficulty":"進階","question":"情境：團隊想讓每一筆樣本對總評分貢獻相同。最適合的技術或概念為何？","options":["Cohen Kappa","Micro F1","Macro F1","Balanced Accuracy"],"answer":1,"explanation":"Micro F1：先彙總所有類別的TP、FP、FN再計算F1。Micro F1較受多數類別影響；單標籤多類別時常等於Accuracy。","subject":"人工智慧基礎概論"},{"id":596,"category":"模型分析與驗證","difficulty":"進階","question":"關於「Micro F1」，下列敘述何者最正確？","options":["先彙總所有類別的TP、FP、FN再計算F1","主要用來提高硬體運算速度，與模型分析無關","可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況"],"answer":0,"explanation":"Micro F1的重點是：先彙總所有類別的TP、FP、FN再計算F1。Micro F1較受多數類別影響；單標籤多類別時常等於Accuracy。","subject":"人工智慧基礎概論"},{"id":597,"category":"模型分析與驗證","difficulty":"進階","question":"情境：正負樣本高度不平衡，希望避免只預測多數類仍取得高分。最適合的技術或概念為何？","options":["Log Loss","MAE","R²","Balanced Accuracy"],"answer":3,"explanation":"Balanced Accuracy：各類別召回率的平均。二元分類時可視為Sensitivity與Specificity平均。","subject":"人工智慧基礎概論"},{"id":598,"category":"模型分析與驗證","difficulty":"進階","question":"關於「Balanced Accuracy」，下列敘述何者最正確？","options":["可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況","各類別召回率的平均","主要用來提高硬體運算速度，與模型分析無關"],"answer":2,"explanation":"Balanced Accuracy的重點是：各類別召回率的平均。二元分類時可視為Sensitivity與Specificity平均。","subject":"人工智慧基礎概論"},{"id":599,"category":"模型分析與驗證","difficulty":"進階","question":"情境：團隊不只想報AUC=0.86，也要提供95%信賴區間。最適合的技術或概念為何？","options":["Grid Search","Bootstrap Confidence Interval","One-Hot Encoding","Batch Normalization"],"answer":1,"explanation":"Bootstrap Confidence Interval：對資料重複有放回抽樣以估計指標不確定性。Bootstrap常用於模型指標的不確定性估計。","subject":"人工智慧基礎概論"},{"id":600,"category":"模型分析與驗證","difficulty":"進階","question":"關於「Bootstrap Confidence Interval」，下列敘述何者最正確？","options":["對資料重複有放回抽樣以估計指標不確定性","主要用來提高硬體運算速度，與模型分析無關","可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況"],"answer":0,"explanation":"Bootstrap Confidence Interval的重點是：對資料重複有放回抽樣以估計指標不確定性。Bootstrap常用於模型指標的不確定性估計。","subject":"人工智慧基礎概論"},{"id":601,"category":"模型分析與驗證","difficulty":"進階","question":"情境：團隊想判斷新增資料是否可能改善高方差問題。最適合的技術或概念為何？","options":["ROC Curve","Lift Chart","Reliability Diagram","學習曲線（Learning Curve）"],"answer":3,"explanation":"學習曲線（Learning Curve）：比較訓練與驗證效能隨訓練資料量增加的變化。若訓練佳、驗證差且差距隨資料增加縮小，通常是高方差。","subject":"人工智慧基礎概論"},{"id":602,"category":"模型分析與驗證","difficulty":"進階","question":"關於「學習曲線（Learning Curve）」，下列敘述何者最正確？","options":["可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況","比較訓練與驗證效能隨訓練資料量增加的變化","主要用來提高硬體運算速度，與模型分析無關"],"answer":2,"explanation":"學習曲線（Learning Curve）的重點是：比較訓練與驗證效能隨訓練資料量增加的變化。若訓練佳、驗證差且差距隨資料增加縮小，通常是高方差。","subject":"人工智慧基礎概論"},{"id":603,"category":"模型分析與驗證","difficulty":"進階","question":"情境：研究者拿掉注意力模組後比較效能差異。最適合的技術或概念為何？","options":["分層抽樣","消融實驗（Ablation Study）","資料插補","模型校準"],"answer":1,"explanation":"消融實驗（Ablation Study）：移除或替換系統元件以評估其實際貢獻。消融能驗證某元件是否真的帶來增益。","subject":"人工智慧基礎概論"},{"id":604,"category":"模型分析與驗證","difficulty":"進階","question":"關於「消融實驗（Ablation Study）」，下列敘述何者最正確？","options":["移除或替換系統元件以評估其實際貢獻","主要用來提高硬體運算速度，與模型分析無關","可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況"],"answer":0,"explanation":"消融實驗（Ablation Study）的重點是：移除或替換系統元件以評估其實際貢獻。消融能驗證某元件是否真的帶來增益。","subject":"人工智慧基礎概論"},{"id":605,"category":"模型分析與驗證","difficulty":"進階","question":"情境：醫院A訓練的模型到醫院B測試。最適合的技術或概念為何？","options":["訓練集評估","同一資料K折","超參數搜尋","外部驗證（External Validation）"],"answer":3,"explanation":"外部驗證（External Validation）：在不同機構、時間或族群的獨立資料上評估模型。外部驗證比內部切分更能檢驗可移轉性。","subject":"人工智慧基礎概論"},{"id":606,"category":"模型分析與驗證","difficulty":"進階","question":"關於「外部驗證（External Validation）」，下列敘述何者最正確？","options":["可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況","在不同機構、時間或族群的獨立資料上評估模型","主要用來提高硬體運算速度，與模型分析無關"],"answer":2,"explanation":"外部驗證（External Validation）的重點是：在不同機構、時間或族群的獨立資料上評估模型。外部驗證比內部切分更能檢驗可移轉性。","subject":"人工智慧基礎概論"},{"id":607,"category":"模型分析與驗證","difficulty":"進階","question":"情境：整體準確率高，但需檢查夜間、不同年齡層是否失準。最適合的技術或概念為何？","options":["增加Epoch","切片分析（Slice Analysis）","只看總Accuracy","只看訓練Loss"],"answer":1,"explanation":"切片分析（Slice Analysis）：分別檢查特定族群、情境或資料子集的效能。平均指標可能掩蓋關鍵子群失效。","subject":"人工智慧基礎概論"},{"id":608,"category":"模型分析與驗證","difficulty":"進階","question":"關於「切片分析（Slice Analysis）」，下列敘述何者最正確？","options":["分別檢查特定族群、情境或資料子集的效能","主要用來提高硬體運算速度，與模型分析無關","可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況"],"answer":0,"explanation":"切片分析（Slice Analysis）的重點是：分別檢查特定族群、情境或資料子集的效能。平均指標可能掩蓋關鍵子群失效。","subject":"人工智慧基礎概論"},{"id":609,"category":"深度學習進階","difficulty":"進階","question":"情境：深層網路訓練不穩，團隊在卷積層後加入正規化。最適合的技術或概念為何？","options":["Dropout","Weight Decay","Data Augmentation","Batch Normalization"],"answer":3,"explanation":"Batch Normalization：以批次統計量正規化中間激活值並學習縮放與平移。訓練與推論使用的統計方式不同。","subject":"人工智慧基礎概論"},{"id":610,"category":"深度學習進階","difficulty":"進階","question":"關於「Batch Normalization」，下列敘述何者最正確？","options":["可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況","以批次統計量正規化中間激活值並學習縮放與平移","主要用來提高硬體運算速度，與模型分析無關"],"answer":2,"explanation":"Batch Normalization的重點是：以批次統計量正規化中間激活值並學習縮放與平移。訓練與推論使用的統計方式不同。","subject":"人工智慧基礎概論"},{"id":611,"category":"深度學習進階","difficulty":"進階","question":"情境：Transformer中需要不依批次大小的正規化方式。最適合的技術或概念為何？","options":["PCA","Layer Normalization","Batch Normalization","Min-Max Scaling"],"answer":1,"explanation":"Layer Normalization：對單一樣本的特徵維度正規化。LayerNorm常用於Transformer與序列模型。","subject":"人工智慧基礎概論"},{"id":612,"category":"深度學習進階","difficulty":"進階","question":"關於「Layer Normalization」，下列敘述何者最正確？","options":["對單一樣本的特徵維度正規化","主要用來提高硬體運算速度，與模型分析無關","可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況"],"answer":0,"explanation":"Layer Normalization的重點是：對單一樣本的特徵維度正規化。LayerNorm常用於Transformer與序列模型。","subject":"人工智慧基礎概論"},{"id":613,"category":"深度學習進階","difficulty":"進階","question":"情境：Sigmoid深層網路前幾層權重幾乎不更新。最適合的技術或概念為何？","options":["梯度爆炸","資料漂移","類別不平衡","梯度消失"],"answer":3,"explanation":"梯度消失：深層網路前段梯度趨近零，導致難以學習。可用ReLU、殘差連接與適當初始化緩解。","subject":"人工智慧基礎概論"},{"id":614,"category":"深度學習進階","difficulty":"進階","question":"關於「梯度消失」，下列敘述何者最正確？","options":["可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況","深層網路前段梯度趨近零，導致難以學習","主要用來提高硬體運算速度，與模型分析無關"],"answer":2,"explanation":"梯度消失的重點是：深層網路前段梯度趨近零，導致難以學習。可用ReLU、殘差連接與適當初始化緩解。","subject":"人工智慧基礎概論"},{"id":615,"category":"深度學習進階","difficulty":"進階","question":"情境：RNN訓練Loss突然變成NaN。最適合的技術或概念為何？","options":["概念漂移","梯度爆炸","梯度消失","過度校準"],"answer":1,"explanation":"梯度爆炸：反向傳播時梯度急遽增大造成不穩定或NaN。Gradient clipping是常見緩解方式。","subject":"人工智慧基礎概論"},{"id":616,"category":"深度學習進階","difficulty":"進階","question":"關於「梯度爆炸」，下列敘述何者最正確？","options":["反向傳播時梯度急遽增大造成不穩定或NaN","主要用來提高硬體運算速度，與模型分析無關","可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況"],"answer":0,"explanation":"梯度爆炸的重點是：反向傳播時梯度急遽增大造成不穩定或NaN。Gradient clipping是常見緩解方式。","subject":"人工智慧基礎概論"},{"id":617,"category":"深度學習進階","difficulty":"進階","question":"情境：網路加深後退化，研究者加入skip connection。最適合的技術或概念為何？","options":["池化","Embedding","Quantization","殘差連接（Residual Connection）"],"answer":3,"explanation":"殘差連接（Residual Connection）：讓輸入繞過部分層與輸出相加，改善深層網路訓練。殘差連接有助梯度流動。","subject":"人工智慧基礎概論"},{"id":618,"category":"深度學習進階","difficulty":"進階","question":"關於「殘差連接（Residual Connection）」，下列敘述何者最正確？","options":["可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況","讓輸入繞過部分層與輸出相加，改善深層網路訓練","主要用來提高硬體運算速度，與模型分析無關"],"answer":2,"explanation":"殘差連接（Residual Connection）的重點是：讓輸入繞過部分層與輸出相加，改善深層網路訓練。殘差連接有助梯度流動。","subject":"人工智慧基礎概論"},{"id":619,"category":"深度學習進階","difficulty":"進階","question":"情境：ReLU網路採He initialization。最適合的技術或概念為何？","options":["知識蒸餾","權重初始化","資料標準化","資料分割"],"answer":1,"explanation":"權重初始化：在訓練前設定參數初始分布以維持激活與梯度尺度。初始化不當可能造成梯度消失或爆炸。","subject":"人工智慧基礎概論"},{"id":620,"category":"深度學習進階","difficulty":"進階","question":"關於「權重初始化」，下列敘述何者最正確？","options":["在訓練前設定參數初始分布以維持激活與梯度尺度","主要用來提高硬體運算速度，與模型分析無關","可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況"],"answer":0,"explanation":"權重初始化的重點是：在訓練前設定參數初始分布以維持激活與梯度尺度。初始化不當可能造成梯度消失或爆炸。","subject":"人工智慧基礎概論"},{"id":621,"category":"深度學習進階","difficulty":"進階","question":"情境：訓練Loss持續下降但驗證Loss開始上升。最適合的技術或概念為何？","options":["增加Epoch","刪除驗證集","提高模型深度","Early Stopping"],"answer":3,"explanation":"Early Stopping：當驗證集表現停止改善時提前終止訓練。通常保留最佳驗證表現的權重。","subject":"人工智慧基礎概論"},{"id":622,"category":"深度學習進階","difficulty":"進階","question":"關於「Early Stopping」，下列敘述何者最正確？","options":["可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況","當驗證集表現停止改善時提前終止訓練","主要用來提高硬體運算速度，與模型分析無關"],"answer":2,"explanation":"Early Stopping的重點是：當驗證集表現停止改善時提前終止訓練。通常保留最佳驗證表現的權重。","subject":"人工智慧基礎概論"},{"id":623,"category":"深度學習進階","difficulty":"進階","question":"情境：前期快速學習、後期降低步幅精細收斂。最適合的技術或概念為何？","options":["模型校準","Learning Rate Scheduler","資料增強","特徵選擇"],"answer":1,"explanation":"Learning Rate Scheduler：依訓練進度動態調整學習率。常見有step decay、cosine decay與warmup。","subject":"人工智慧基礎概論"},{"id":624,"category":"深度學習進階","difficulty":"進階","question":"關於「Learning Rate Scheduler」，下列敘述何者最正確？","options":["依訓練進度動態調整學習率","主要用來提高硬體運算速度，與模型分析無關","可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況"],"answer":0,"explanation":"Learning Rate Scheduler的重點是：依訓練進度動態調整學習率。常見有step decay、cosine decay與warmup。","subject":"人工智慧基礎概論"},{"id":625,"category":"深度學習進階","difficulty":"進階","question":"情境：大型Transformer訓練初期避免更新過猛。最適合的技術或概念為何？","options":["冷啟動推薦","資料插補","模型剪枝","Warmup"],"answer":3,"explanation":"Warmup：訓練初期從很小學習率逐步增加。Warmup常與後續衰減排程搭配。","subject":"人工智慧基礎概論"},{"id":626,"category":"深度學習進階","difficulty":"進階","question":"關於「Warmup」，下列敘述何者最正確？","options":["可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況","訓練初期從很小學習率逐步增加","主要用來提高硬體運算速度，與模型分析無關"],"answer":2,"explanation":"Warmup的重點是：訓練初期從很小學習率逐步增加。Warmup常與後續衰減排程搭配。","subject":"人工智慧基礎概論"},{"id":627,"category":"深度學習進階","difficulty":"進階","question":"情境：RNN訓練時梯度爆炸。最適合的技術或概念為何？","options":["Label Smoothing","Gradient Clipping","Dropout","Batch Sampling"],"answer":1,"explanation":"Gradient Clipping：限制梯度範數或數值避免過大更新。它主要穩定訓練，不直接解決資料偏差。","subject":"人工智慧基礎概論"},{"id":628,"category":"深度學習進階","difficulty":"進階","question":"關於「Gradient Clipping」，下列敘述何者最正確？","options":["限制梯度範數或數值避免過大更新","主要用來提高硬體運算速度，與模型分析無關","可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況"],"answer":0,"explanation":"Gradient Clipping的重點是：限制梯度範數或數值避免過大更新。它主要穩定訓練，不直接解決資料偏差。","subject":"人工智慧基礎概論"},{"id":629,"category":"深度學習進階","difficulty":"進階","question":"情境：分類模型輸出機率過於極端，團隊把1改成0.9並分配其餘機率。最適合的技術或概念為何？","options":["One-Hot Encoding","SMOTE","Teacher Forcing","Label Smoothing"],"answer":3,"explanation":"Label Smoothing：將硬標籤稍微平滑，降低模型過度自信。可改善泛化與校準，但過度使用可能降低辨識。","subject":"人工智慧基礎概論"},{"id":630,"category":"深度學習進階","difficulty":"進階","question":"關於「Label Smoothing」，下列敘述何者最正確？","options":["可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況","將硬標籤稍微平滑，降低模型過度自信","主要用來提高硬體運算速度，與模型分析無關"],"answer":2,"explanation":"Label Smoothing的重點是：將硬標籤稍微平滑，降低模型過度自信。可改善泛化與校準，但過度使用可能降低辨識。","subject":"人工智慧基礎概論"},{"id":631,"category":"深度學習進階","difficulty":"進階","question":"情境：翻譯模型訓練使用正確前一個token，而非自己預測。最適合的技術或概念為何？","options":["Dropout","Teacher Forcing","Knowledge Distillation","Beam Search"],"answer":1,"explanation":"Teacher Forcing：序列模型訓練時將真實前一步輸出餵給下一步。推論時無真實前一步，可能產生exposure bias。","subject":"人工智慧基礎概論"},{"id":6 與治理進階","difficulty":"進階","question":"情境：與供應商契約明訂資料外洩賠償責任。最適合的技術或概念為何？","options":["停止監控","風險移轉（Risk Transfer）","刪除所有資料","增加模型層數"],"answer":1,"explanation":"風險移轉（Risk Transfer）：透過保險、契約或外包將部分財務或履約風險移轉。法律與聲譽責任通常無法完全移轉。","subject":"人工智慧基礎概論"},{"id":732,"category":"MLOps與治理進階","difficulty":"進階","question":"關於「風險移轉（Risk Transfer）」，下列敘述何者最正確？","options":["透過保險、契約或外包將部分財務或履約風險移轉","主要用來提高硬體運算速度，與模型分析無關","可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況"],"answer":0,"explanation":"風險移轉（Risk Transfer）的重點是：透過保險、契約或外包將部分財務或履約風險移轉。法律與聲譽責任通常無法完全移轉。","subject":"人工智慧基礎概論"},{"id":733,"category":"MLOps與治理進階","difficulty":"進階","question":"情境：蒐集客服錄音不得未經評估改拿去做員工績效淘汰。最適合的技術或概念為何？","options":["無限期保存","全面公開","任意再利用","用途限制（Purpose Limitation）"],"answer":3,"explanation":"用途限制（Purpose Limitation）：個資只依原先明確告知與合法目的使用。變更用途需重新確認合法性與告知。","subject":"人工智慧基礎概論"},{"id":734,"category":"MLOps與治理進階","difficulty":"進階","question":"關於「用途限制（Purpose Limitation）」，下列敘述何者最正確？","options":["可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況","個資只依原先明確告知與合法目的使用","主要用來提高硬體運算速度，與模型分析無關"],"answer":2,"explanation":"用途限制（Purpose Limitation）的重點是：個資只依原先明確告知與合法目的使用。變更用途需重新確認合法性與告知。","subject":"人工智慧基礎概論"},{"id":735,"category":"MLOps與治理進階","difficulty":"進階","question":"情境：履歷資料不應無限期保存。最適合的技術或概念為何？","options":["取消存取控制","資料保留期限","永久保存最好","每天複製更多份"],"answer":1,"explanation":"資料保留期限：依目的與法規設定資料保存時間，到期刪除或匿名化。保留政策需可執行與稽核。","subject":"人工智慧基礎概論"},{"id":736,"category":"MLOps與治理進階","difficulty":"進階","question":"關於「資料保留期限」，下列敘述何者最正確？","options":["依目的與法規設定資料保存時間，到期刪除或匿名化","主要用來提高硬體運算速度，與模型分析無關","可保證模型在所有資料上都不會出錯","只適用於完全沒有訓練資料的情況"],"answer":0,"explanation":"資料保留期限的重點是：依目的與法規設定資料保存時間，到期刪除或匿名化。保留政策需可執行與稽核。","subject":"人工智慧基礎概論"},{"id":737,"category":"MLOps與治理進階","difficulty":"進階","question":"情境：政府採用福利審核AI前進行影響評估。最適合的技術或概念為何？","options":["只跑Benchmark","只算GPU成本","只看介面美觀","Algorithmic Impact Assessment"],"answer":3,"explanation":"Algorithmic Impact Assessment：在導入前系統性評估AI對權利、安全、公平與社會的影響。應隨用途與風險更新。","subject":"人工智慧基礎概論"},{"id":738,"category":"MLOps與治理進階","difficulty":"進階","que question":"某團隊面臨以下問題：某企業合併ERP、CRM與感測器資料，先統一欄位與格式。下列改善方向何者最適當？","options":["優先採用「資料整合」，因為它能統一多來源資料格式、處理重複並提升資料完整性","只提高Temperature，讓結果更多樣","只增加硬體規格，不調整資料或流程","取消所有限制，讓模型自行嘗試直到成功"],"answer":0,"explanation":"應優先採用「資料整合」。統一多來源資料格式、處理重複並提升資料完整性；延長原始資料保存期限並不是資料整合的核心目的。","subject":"人工智慧基礎概論"},{"id":872,"category":"附件衍生｜資料與機器學習","difficulty":"進階","question":"情境：城市部署大量PM2.5與設備狀態感測器。下列哪一項技術或概念最符合此需求？","options":["資料增強","Label Encoding風險","感測器網路","直方圖"],"answer":2,"explanation":"答案是「感測器網路」。持續蒐集環境與設備狀態資料；適合智慧城市即時監測空氣品質與垃圾桶滿溢度。","subject":"人工智慧基礎概論"},{"id":875,"category":"附件衍生｜資料與機器學習","difficulty":"進階","question":"某團隊面臨以下問題：城市部署大量PM2.5與設備狀態感測器。下列改善方向何者最適當？","options":["取消所有限制，讓模型自行嘗試直到成功","只提高Temperature，讓結果更多樣","優先採用「感測器網路」，因為它能持續蒐集環境與設備狀態資料","只增加硬體規格，不調整資料或流程"],"answer":2,"explanation":"應優先採用「感測器網路」。持續蒐集環境與設備狀態資料；適合智慧城市即時監測空氣品質與垃圾桶滿溢度。","subject":"人工智慧基礎概論"},{"id":876,"category":"附件衍生｜資料與機器學習","difficulty":"進階","question":"情境：團隊先切訓練與測試，再以訓練集平均值標準化兩者。下列哪一項技術或概念最符合此需求？","options":["散佈圖","資料洩漏防範","Label Encoding風險","Softmax"],"answer":1,"explanation":"答案是「資料洩漏防範」。只用訓練集計算標準化統計量，再套用到測試集；若用完整資料計算平均與標準差，會讓測試資訊進入訓練流程。","subject":"人工智慧基礎概論"},{"id":879,"category":"附件衍生｜資料與機器學習","difficulty":"進階","question":"某團隊面臨以下問題：團隊先切訓練與測試，再以訓練集平均值標準化兩者。下列改善方向何者最適當？","options":["優先採用「資料洩漏防範」，因為它能只用訓練集計算標準化統計量，再套用到測試集","只增加硬體規格，不調整資料或流程","只提高Temperature，讓結果更多樣","取消所有限制，讓模型自行嘗試直到成功"],"answer":0,"explanation":"應優先採用「資料洩漏防範」。只用訓練集計算標準化統計量，再套用到測試集；若用完整資料計算平均與標準差，會讓測試資訊進入訓練流程。","subject":"人工智慧基礎概論"},{"id":880,"category":"附件衍生｜資料與機器學習","difficulty":"進階","question":"情境：詐欺樣本極少，團隊依鄰近少數樣本合成新案例。下列哪一項技術或概念最符合此需求？","options":["資料增強","決策樹尺度不敏感","SMOTE","感測器網路"],"answer":2,"explanation":"答案是「SMOTE」。在少數類別特徵空間內合成新樣本；用於改善類別不平衡，不是刪除多數類別或調整損失權重。","subject":"人工智慧基礎概論"},{"id":883,"category":"附件衍生｜資料與機器學習","difficulty":"進階","question":"某團隊面臨以下問題：詐欺樣本極少，團隊依鄰近少數樣本合成新案例。下列改善方向何者最適當？","options":["優先採用「SMOTE」，因為它能在少數類別特徵空間內合成新樣本","只提高Temperature，讓結果更多樣","只增加硬體規格，不調整資料或流程","取消所有限制，讓模型自行嘗試直到成功"],"answer":0,"explanation":"應優先採用「SMOTE」。在少數類別特徵空間內合成新樣本；用於改善類別不平衡，不是刪除多數類別或調整損失權重。","subject":"人工智慧基礎概論"},{"id":884,"category":"附件衍生｜資料與機器學習","difficulty":"進階","question":"情境：零售推薦同時處理大量稀疏類別特徵與數值特徵。下列哪一項技術或概念最符合此需求？","options":["線性插補","散佈圖","L1稀疏性","Wide and Deep"],"answer":3,"explanation":"答案是「Wide and Deep」。同時記憶已知特徵組合並泛化到未見組合；Wide部分偏記憶，Deep部分偏泛化。","subject":"人工智慧基礎概論"},{"id":887,"category":"附件衍生｜資料與機器學習","difficulty":"進階","question":"某團隊面臨以下問題：零售推薦同時處理大量稀疏類別特徵與數值特徵。下列改善方向何者最適當？","options":["只提高Temperature，讓結果更多樣","優先採用「Wide and Deep」，因為它能同時記憶已知特徵組合並泛化到未見組合","取消所有限制，讓模型自行嘗試直到成功","只增加硬體規格，不調整資料或流程"],"answer":1,"explanation":"應優先採用「Wide and Deep」。同時記憶已知特徵組合並泛化到未見組合；Wide部分偏記憶，Deep部分偏泛化。","subject":"人工智慧基礎概論"},{"id":888,"category":"附件衍生｜資料與機器學習","difficulty":"進階","question":"情境：影音平台要輸出各影片類型的推薦機率。下列哪一項技術或概念最符合此需求？","options":["資料洩漏防範","Softmax","線性插補","感測器網路"],"answer":1,"explanation":"答案是「Softmax」。將多類別輸出轉成總和為1的機率分布；常用於互斥多類別分類的輸出層。","subject":"人工智慧基礎概論"},{"id":891,"category":"附件衍生｜資料與機器學習","difficulty":"進階","question":"某團隊面臨以下問題：影音平台要輸出各影片類型的推薦機率。下列改善方向何者最適當？","options":["只提高Temperature，讓結果更多樣","優先採用「Softmax」，因為它能將多類別輸出轉成總和為1的機率分布","只增加硬體規格，不調整資料或流程","取消所有限制，讓模型自行嘗試直到成功"],"answer":1,"explanation":"應優先採用「Softmax」。將多類別輸出轉成總和為1的機率分布；常用於互斥多類別分類的輸出層。","subject":"人工智慧基礎概論"},{"id":892,"category":"附件衍生｜資料與機器學習","difficulty":"進階","question":"情境：分析顧客年齡集中在哪些區間。下列哪一項技術或概念最符合此需求？","options":["探索與利用權衡","MSE","偏差與變異權衡","直方圖"],"answer":3,"explanation":"答案是「直方圖」。呈現單一數值變數在不同區間的分布；不適合直接呈現兩個數值變數的關聯。","subject":"人工智慧基礎概論"},{"id":895,"category":"附件衍生｜資料與機器學習","difficulty":"進階","question":"某團隊面臨以下問題：分析顧客年齡集中在哪些區間。下列改善方向何者最適當？","options":["優先採用「直方圖」，因為它能呈現單一數值變數在不同區間的分布","只增加硬體規格，不調整資料或流程","只提高Temperature，讓結果更多樣","取消所有限制，讓模型自行嘗試直到成功"],"answer":0,"explanation":"應優先採用「直方圖」。呈現單一數值變數在不同區間的分布；不適合直接呈現兩個數值變數的關聯。","subject":"人工智慧基礎概論"},{"id":896,"category":"附件衍生｜資料與機器學習","difficulty":"進階","question":"情境：分析身高與體重是否相關。下列哪一項技術或概念最符合此需求？","options":["SMOTE","散佈圖","Softmax","資料洩漏防範"],"answer":1,"explanation":"答案是「散佈圖」。呈現兩個數值變數間的關係；可觀察相關方向、群聚
